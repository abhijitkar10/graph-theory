<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" width="660" height="620" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="620" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">An ear is trivial when it has no interior. Trivial and open are two different questions.</text>
<text x="200" y="58" font-size="13" fill="#333333" text-anchor="middle">The subgraph H you already have</text>
<line x1="200" y1="87" x2="145" y2="127" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="145" y1="127" x2="166" y2="192" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="166" y1="192" x2="234" y2="192" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="234" y1="192" x2="255" y2="127" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="255" y1="127" x2="200" y2="87" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="200" cy="87" r="6" fill="#333333"/>
<circle cx="145" cy="127" r="6" fill="#333333"/>
<circle cx="166" cy="192" r="6" fill="#333333"/>
<circle cx="234" cy="192" r="6" fill="#333333"/>
<circle cx="255" cy="127" r="6" fill="#333333"/>
<text x="200" y="72" font-size="12" fill="#666666" text-anchor="middle">a</text>
<text x="129" y="127" font-size="12" fill="#666666" text-anchor="end">b</text>
<text x="154" y="212" font-size="12" fill="#666666" text-anchor="end">c</text>
<text x="246" y="212" font-size="12" fill="#666666" text-anchor="start">d</text>
<text x="271" y="127" font-size="12" fill="#666666" text-anchor="start">e</text>
<text x="200" y="248" font-size="12" fill="#666666" text-anchor="middle">A cycle. Nothing added yet.</text>
<text x="478" y="58" font-size="13" fill="#3B6D11" text-anchor="middle">A trivial ear: the single edge ac</text>
<line x1="478" y1="87" x2="423" y2="127" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="423" y1="127" x2="444" y2="192" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="444" y1="192" x2="512" y2="192" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="512" y1="192" x2="533" y2="127" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="533" y1="127" x2="478" y2="87" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="478" cy="87" r="6" fill="#333333"/>
<circle cx="423" cy="127" r="6" fill="#333333"/>
<circle cx="444" cy="192" r="6" fill="#333333"/>
<circle cx="512" cy="192" r="6" fill="#333333"/>
<circle cx="533" cy="127" r="6" fill="#333333"/>
<text x="478" y="72" font-size="12" fill="#666666" text-anchor="middle">a</text>
<text x="407" y="127" font-size="12" fill="#666666" text-anchor="end">b</text>
<text x="432" y="212" font-size="12" fill="#666666" text-anchor="end">c</text>
<text x="524" y="212" font-size="12" fill="#666666" text-anchor="start">d</text>
<text x="549" y="127" font-size="12" fill="#666666" text-anchor="start">e</text>
<line x1="478" y1="87" x2="444" y2="192" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<text x="478" y="248" font-size="12" fill="#666666" text-anchor="middle">No new vertices and no interior. Its ends a and c</text>
<text x="478" y="268" font-size="12" fill="#666666" text-anchor="middle">differ, so it is open.</text>
<text x="228" y="322" font-size="13" fill="#3B6D11" text-anchor="middle">A non-trivial open ear: a, x, c</text>
<line x1="228" y1="352" x2="173" y2="392" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="173" y1="392" x2="194" y2="457" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="194" y1="457" x2="262" y2="457" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="262" y1="457" x2="283" y2="392" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="283" y1="392" x2="228" y2="352" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="228" cy="352" r="6" fill="#333333"/>
<circle cx="173" cy="392" r="6" fill="#333333"/>
<circle cx="194" cy="457" r="6" fill="#333333"/>
<circle cx="262" cy="457" r="6" fill="#333333"/>
<circle cx="283" cy="392" r="6" fill="#333333"/>
<text x="228" y="337" font-size="12" fill="#666666" text-anchor="middle">a</text>
<text x="157" y="392" font-size="12" fill="#666666" text-anchor="end">b</text>
<text x="182" y="477" font-size="12" fill="#666666" text-anchor="end">c</text>
<text x="274" y="477" font-size="12" fill="#666666" text-anchor="start">d</text>
<text x="299" y="392" font-size="12" fill="#666666" text-anchor="start">e</text>
<line x1="228" y1="352" x2="116" y2="402" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<line x1="116" y1="402" x2="194" y2="457" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="116" cy="402" r="7" fill="#3B6D11"/>
<text x="102" y="407" font-size="13" fill="#3B6D11" text-anchor="end">x</text>
<text x="228" y="522" font-size="12" fill="#666666" text-anchor="middle">One interior vertex, so not trivial.</text>
<text x="228" y="542" font-size="12" fill="#666666" text-anchor="middle">Ends still differ, so still open.</text>
<text x="470" y="322" font-size="13" fill="#C0392B" text-anchor="middle">A closed ear: d, x, y, d</text>
<line x1="470" y1="340" x2="415" y2="380" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="415" y1="380" x2="436" y2="445" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="436" y1="445" x2="504" y2="445" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="504" y1="445" x2="525" y2="380" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="525" y1="380" x2="470" y2="340" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="470" cy="340" r="6" fill="#333333"/>
<circle cx="415" cy="380" r="6" fill="#333333"/>
<circle cx="436" cy="445" r="6" fill="#333333"/>
<circle cx="504" cy="445" r="6" fill="#333333"/>
<circle cx="525" cy="380" r="6" fill="#333333"/>
<text x="470" y="325" font-size="12" fill="#666666" text-anchor="middle">a</text>
<text x="399" y="380" font-size="12" fill="#666666" text-anchor="end">b</text>
<text x="424" y="465" font-size="12" fill="#666666" text-anchor="end">c</text>
<text x="498" y="467" font-size="12" fill="#666666" text-anchor="end">d</text>
<text x="541" y="380" font-size="12" fill="#666666" text-anchor="start">e</text>
<line x1="504" y1="445" x2="556" y2="462" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="556" y1="462" x2="548" y2="528" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="548" y1="528" x2="504" y2="445" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="556" cy="462" r="7" fill="#C0392B"/>
<circle cx="548" cy="528" r="7" fill="#C0392B"/>
<text x="570" y="467" font-size="13" fill="#C0392B" text-anchor="start">x</text>
<text x="562" y="533" font-size="13" fill="#C0392B" text-anchor="start">y</text>
<text x="470" y="562" font-size="12" fill="#666666" text-anchor="middle">Both ends are d, so it is closed. Delete d</text>
<text x="470" y="582" font-size="12" fill="#666666" text-anchor="middle">and the whole ear falls off.</text>
<text x="330" y="608" font-size="12" fill="#666666" text-anchor="middle">A trivial ear is always open, since a simple graph has no loops and its two ends cannot coincide.</text>
</svg>
