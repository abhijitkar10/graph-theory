<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="340" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Superimposing two matchings. Every vertex meets at most one edge of each, so degrees are at most 2.</text>
<line x1="80" y1="120" x2="200" y2="120" stroke="#3B6D11" stroke-width="4"/>
<line x1="200" y1="120" x2="320" y2="120" stroke="#185FA5" stroke-width="2.5"/>
<line x1="320" y1="120" x2="440" y2="120" stroke="#3B6D11" stroke-width="4"/>
<circle cx="80" cy="120" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="80" y="124" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="200" cy="120" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="200" y="124" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="320" cy="120" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="320" y="124" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="440" cy="120" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="440" y="124" text-anchor="middle" font-size="12" fill="#222222"></text>
<text x="260" y="158" text-anchor="middle" font-size="12" fill="#666666">a path, edges taking turns</text>
<line x1="540" y1="90" x2="620" y2="90" stroke="#3B6D11" stroke-width="4"/>
<line x1="620" y1="90" x2="620" y2="170" stroke="#185FA5" stroke-width="2.5"/>
<line x1="620" y1="170" x2="540" y2="170" stroke="#3B6D11" stroke-width="4"/>
<line x1="540" y1="170" x2="540" y2="90" stroke="#185FA5" stroke-width="2.5"/>
<circle cx="540" cy="90" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="540" y="94" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="620" cy="90" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="620" y="94" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="620" cy="170" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="620" y="174" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="540" cy="170" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="540" y="174" text-anchor="middle" font-size="12" fill="#222222"></text>
<text x="580" y="196" text-anchor="middle" font-size="12" fill="#666666">an even cycle</text>
<text x="20" y="240" text-anchor="start" font-size="13" fill="#666666">Green is one matching, blue is the other. Two edges of the same colour cannot meet, so colours alternate.</text>
<text x="20" y="264" text-anchor="start" font-size="13" fill="#666666">A graph with all degrees at most 2 breaks into paths and cycles, and here they alternate, so every cycle is even.</text>
<text x="20" y="294" text-anchor="start" font-size="13" fill="#C0392B">Cycles and even length paths carry equal numbers of each colour. Only an odd length path can hold a surplus.</text>
<text x="20" y="318" text-anchor="start" font-size="13" fill="#C0392B">So if the blue matching is bigger, some component must be an odd path with blue at both ends. That is an augmenting path.</text>
</svg>