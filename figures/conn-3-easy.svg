<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="340" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Whitney, easy direction: one deleted vertex spoils at most one of two disjoint paths.</text>
<line x1="90" y1="115" x2="250" y2="78" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="250" y1="78" x2="400" y2="170" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="400" y1="170" x2="250" y2="265" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="250" y1="265" x2="90" y2="115" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="400" y1="170" x2="560" y2="115" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="560" y1="115" x2="560" y2="265" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="560" y1="265" x2="250" y2="265" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="115" x2="250" y2="78" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/>
<line x1="250" y1="78" x2="400" y2="170" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/>
<line x1="400" y1="170" x2="560" y2="115" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/>
<line x1="90" y1="115" x2="250" y2="265" stroke="#3B6D11" stroke-width="3.2" stroke-linecap="round"/>
<line x1="250" y1="265" x2="560" y2="265" stroke="#3B6D11" stroke-width="3.2" stroke-linecap="round"/>
<line x1="560" y1="265" x2="560" y2="115" stroke="#3B6D11" stroke-width="3.2" stroke-linecap="round"/>
<circle cx="90" cy="115" r="5" fill="#333333"/>
<circle cx="400" cy="170" r="5" fill="#333333"/>
<circle cx="250" cy="265" r="5" fill="#333333"/>
<circle cx="560" cy="115" r="5" fill="#333333"/>
<circle cx="560" cy="265" r="5" fill="#333333"/>
<circle cx="250" cy="78" r="9" fill="none" stroke="#666666" stroke-width="2.4" stroke-dasharray="4 3"/>
<text x="252" y="60" font-size="12" fill="#666666" text-anchor="middle">v₁ deleted</text>
<text x="68" y="120" font-size="15" fill="#333333" text-anchor="middle">x</text>
<text x="426" y="175" font-size="14" fill="#333333" text-anchor="middle">v₂</text>
<text x="246" y="291" font-size="14" fill="#333333" text-anchor="middle">a</text>
<text x="582" y="120" font-size="15" fill="#333333" text-anchor="middle">y</text>
<text x="582" y="270" font-size="14" fill="#333333" text-anchor="middle">c</text>
<text x="175" y="325" font-size="12" fill="#C0392B" text-anchor="middle">this path dies with v₁</text>
<text x="450" y="325" font-size="12" fill="#3B6D11" text-anchor="middle">this one is untouched, so x and y stay joined</text>
</svg>
