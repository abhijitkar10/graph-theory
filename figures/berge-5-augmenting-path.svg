<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="40" y="35" font-size="22" font-weight="700" fill="#1f2937">One component of M ∪ N that forces an augmenting path</text>
  <text x="40" y="64" font-size="16" fill="#4b5563">Green edges belong to M; blue edges belong to N.  Here N has one more edge than M.</text>

  <line x1="105" y1="145" x2="230" y2="145" stroke="#185FA5" stroke-width="7" stroke-linecap="round"/>
  <line x1="230" y1="145" x2="355" y2="145" stroke="#3B6D11" stroke-width="7" stroke-linecap="round"/>
  <line x1="355" y1="145" x2="480" y2="145" stroke="#185FA5" stroke-width="7" stroke-linecap="round"/>
  <line x1="480" y1="145" x2="605" y2="145" stroke="#3B6D11" stroke-width="7" stroke-linecap="round"/>
  <line x1="605" y1="145" x2="730" y2="145" stroke="#185FA5" stroke-width="7" stroke-linecap="round"/>

  <g fill="#ffffff" stroke="#1f2937" stroke-width="3">
    <circle cx="105" cy="145" r="18"/>
    <circle cx="230" cy="145" r="18"/>
    <circle cx="355" cy="145" r="18"/>
    <circle cx="480" cy="145" r="18"/>
    <circle cx="605" cy="145" r="18"/>
    <circle cx="730" cy="145" r="18"/>
  </g>

  <g font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">
    <text x="105" y="151">u</text>
    <text x="230" y="151">a</text>
    <text x="355" y="151">b</text>
    <text x="480" y="151">c</text>
    <text x="605" y="151">d</text>
    <text x="730" y="151">v</text>
  </g>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="168" y="120" fill="#185FA5">N</text>
    <text x="293" y="120" fill="#3B6D11">M</text>
    <text x="418" y="120" fill="#185FA5">N</text>
    <text x="543" y="120" fill="#3B6D11">M</text>
    <text x="668" y="120" fill="#185FA5">N</text>
  </g>

  <path d="M 105 182 L 105 214 L 730 214 L 730 182" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="418" y="242" text-anchor="middle" font-size="17" fill="#C0392B">The path begins and ends with N: 3 N-edges, but only 2 M-edges.</text>
  <text x="418" y="275" text-anchor="middle" font-size="16" fill="#4b5563">u and v have no M-edge in this component; they cannot have one elsewhere, so they are free in M.</text>
</svg>
