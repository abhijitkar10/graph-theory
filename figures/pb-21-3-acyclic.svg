<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 442" width="660" height="442" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="442" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 21.3. A cycle in the block graph lets you route around every cut vertex on it.</text>
<text x="160" y="58" font-size="12" fill="#666666" text-anchor="middle">if the block graph had a cycle</text>
<line x1="78" y1="186" x2="172" y2="116" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="172" y1="116" x2="268" y2="186" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="268" y1="186" x2="222" y2="292" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="222" y1="292" x2="124" y2="292" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="124" y1="292" x2="78" y2="186" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<rect x="56" y="171" width="44" height="30" rx="6" fill="#ffffff" stroke="#3B6D11" stroke-width="2"/>
<text x="78" y="191" font-size="13" fill="#3B6D11" text-anchor="middle">B₁</text>
<rect x="246" y="171" width="44" height="30" rx="6" fill="#ffffff" stroke="#3B6D11" stroke-width="2"/>
<text x="268" y="191" font-size="13" fill="#3B6D11" text-anchor="middle">B₂</text>
<rect x="102" y="277" width="44" height="30" rx="6" fill="#ffffff" stroke="#3B6D11" stroke-width="2"/>
<text x="124" y="297" font-size="13" fill="#3B6D11" text-anchor="middle">B₃</text>
<circle cx="172" cy="116" r="8" fill="#C0392B"/>
<text x="190" y="108" font-size="13" fill="#C0392B" text-anchor="middle">c₁</text>
<circle cx="222" cy="292" r="8" fill="#C0392B"/>
<text x="240" y="284" font-size="13" fill="#C0392B" text-anchor="middle">c₂</text>
<text x="330" y="200" font-size="24" fill="#666666" text-anchor="middle">→</text>
<text x="500" y="58" font-size="12" fill="#666666" text-anchor="middle">then in G those blocks merge into one</text>
<ellipse cx="500" cy="206" rx="116" ry="86" fill="none" stroke="#3B6D11" stroke-width="2.4"/>
<text x="500" y="212" font-size="14" fill="#3B6D11" text-anchor="middle">B₁ ∪ B₂ ∪ B₃</text>
<circle cx="448" cy="150" r="7" fill="#C0392B"/>
<circle cx="552" cy="150" r="7" fill="#C0392B"/>
<text x="448" y="176" font-size="12" fill="#C0392B" text-anchor="middle">c₁</text>
<text x="552" y="176" font-size="12" fill="#C0392B" text-anchor="middle">c₂</text>
<text x="500" y="314" font-size="12" fill="#C0392B" text-anchor="middle">no cut vertex left</text>
<text x="330" y="362.0" font-size="12" fill="#666666" text-anchor="middle">Deleting any cᵢ leaves the union joined, because the cycle offers a route round the other way, and</text>
<text x="330" y="382.0" font-size="12" fill="#666666" text-anchor="middle">deleting anything else leaves each block connected. So the union is bigger than B₁ and</text>
<text x="330" y="402" font-size="12" fill="#666666" text-anchor="middle">still has no cut vertex, contradicting maximality.</text>
</svg>
