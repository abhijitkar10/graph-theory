<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 441" width="660" height="441" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="441" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 14.3. Count the edges into S from both ends, and the two threes cancel.</text>
<ellipse cx="330" cy="336" rx="150" ry="50" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<text x="330" y="342" font-size="15" fill="#185FA5" text-anchor="middle">S</text>
<ellipse cx="110" cy="140" rx="46" ry="40" fill="none" stroke="#C0392B" stroke-width="2.4"/>
<text x="110" y="146" font-size="12" fill="#C0392B" text-anchor="middle">odd</text>
<line x1="96" y1="180" x2="229.20000000000002" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="110" y1="180" x2="237.60000000000002" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="124" y1="180" x2="246.00000000000003" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="250" cy="140" rx="46" ry="40" fill="none" stroke="#C0392B" stroke-width="2.4"/>
<text x="250" y="146" font-size="12" fill="#C0392B" text-anchor="middle">odd</text>
<line x1="236" y1="180" x2="288.0" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="250" y1="180" x2="296.4" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="264" y1="180" x2="304.79999999999995" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="410" cy="140" rx="46" ry="40" fill="none" stroke="#C0392B" stroke-width="2.4"/>
<text x="410" y="146" font-size="12" fill="#C0392B" text-anchor="middle">odd</text>
<line x1="396" y1="180" x2="355.20000000000005" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="410" y1="180" x2="363.6" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="424" y1="180" x2="372.0" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="556" cy="140" rx="46" ry="40" fill="none" stroke="#C0392B" stroke-width="2.4"/>
<text x="556" y="146" font-size="12" fill="#C0392B" text-anchor="middle">odd</text>
<line x1="542" y1="180" x2="416.52000000000004" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="556" y1="180" x2="424.92" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<line x1="570" y1="180" x2="433.32" y2="286" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round"/>
<text x="330" y="226" font-size="12" fill="#C0392B" text-anchor="middle">at least 3 edges leave each odd component</text>
<text x="330" y="406" font-size="12" fill="#185FA5" text-anchor="middle">each vertex of S has degree 3, so at most 3∣S∣ edges arrive</text>
<text x="330" y="430.0" font-size="12" fill="#666666" text-anchor="middle">Putting the two together, 3·odd(G − S) ≤ 3∣S∣, so odd(G − S) ≤ ∣S∣, which is Tutte's condition.</text>
</svg>
