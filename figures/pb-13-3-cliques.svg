<text x="256" y="338" font-size="12" fill="#C0392B" text-anchor="middle">each odd clique sends one vertex up into U</text>
<text x="560" y="338.0" font-size="11" fill="#3B6D11" text-anchor="middle">even ones pair</text>
<text x="560" y="357.0" font-size="11" fill="#3B6D11" text-anchor="middle">among themselves</text>
<text x="330" y="389.0" font-size="12" fill="#666666" text-anchor="middle">The condition gives ∣U∣ ≥ odd(H − U), so U has room to receive them. What is left of each odd</text>
<text x="330" y="409.0" font-size="12" fill="#666666" text-anchor="middle">clique is even and still a clique, so it pairs internally. The unused part of U is even in</text>
<text x="330" y="429.0" font-size="12" fill="#666666" text-anchor="middle">size, because n is even, and U is a clique too, so it pairs up as well.</text>
