<circle cx="190" cy="190" r="6" fill="#333333"/>
<circle cx="190" cy="270" r="6" fill="#333333"/>
<circle cx="470" cy="90" r="6" fill="#333333"/>
<circle cx="470" cy="170" r="6" fill="#333333"/>
