<circle cx="470" cy="330" r="6" fill="#333333"/>
<ellipse cx="190" cy="190" rx="40" ry="108" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="190" y="320" font-size="14" fill="#185FA5" text-anchor="middle">S</text>
<ellipse cx="470" cy="170" rx="40" ry="118" fill="none" stroke="#3B6D11" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="470" y="40" font-size="14" fill="#3B6D11" text-anchor="middle">N(S)</text>
<text x="330" y="352" font-size="12" fill="#666666" text-anchor="middle">each vertex of S has its own partner, and the partners are distinct because M is a matching</text>
<text x="330" y="380.0" font-size="12" fill="#666666" text-anchor="middle">Those ∣S∣ distinct partners all lie in N(S), so ∣N(S)∣ ≥ ∣S∣. That is the whole forward direction.</text>
