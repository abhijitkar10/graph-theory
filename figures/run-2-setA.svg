<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="400" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Set A records where v0's neighbours sit. Multiple vi connect back to v0.</text>
<path d="M 60 150 Q 272 -90 485 150" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<path d="M 60 150 Q 187 -30 315 150" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<line x1="60" y1="150" x2="145" y2="150" stroke="#C0392B" stroke-width="5"/>
<line x1="60" y1="150" x2="570" y2="150" stroke="#333333" stroke-width="2"/>
<circle cx="60" cy="150" r="8" fill="#C0392B" stroke="#C0392B" stroke-width="2"/>
<circle cx="145" cy="150" r="8" fill="#C0392B" stroke="#C0392B" stroke-width="2"/>
<circle cx="230" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="315" cy="150" r="8" fill="#C0392B" stroke="#C0392B" stroke-width="2"/>
<circle cx="400" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="485" cy="150" r="8" fill="#C0392B" stroke="#C0392B" stroke-width="2"/>
<circle cx="570" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="60" y="180" text-anchor="middle" font-size="13" fill="#C0392B">v0</text>
<text x="145" y="180" text-anchor="middle" font-size="13" fill="#C0392B">v1</text>
<text x="230" y="180" text-anchor="middle" font-size="13" fill="#888888">v2</text>
<text x="315" y="180" text-anchor="middle" font-size="13" fill="#C0392B">v3</text>
<text x="400" y="180" text-anchor="middle" font-size="13" fill="#888888">v4</text>
<text x="485" y="180" text-anchor="middle" font-size="13" fill="#C0392B">v5</text>
<text x="570" y="180" text-anchor="middle" font-size="13" fill="#888888">v6</text>
<text x="20" y="232" font-size="13" fill="#C0392B">Check each position: is v0 joined to this vertex? Mark the yeses.</text>
<rect x="123" y="250" width="44" height="32" rx="4" fill="#FCEBEB" stroke="#C0392B" stroke-width="2.5"/>
<text x="145" y="272" text-anchor="middle" font-size="14" fill="#222222">1</text>
<rect x="208" y="250" width="44" height="32" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="230" y="272" text-anchor="middle" font-size="14" fill="#aaaaaa">2</text>
<rect x="293" y="250" width="44" height="32" rx="4" fill="#FCEBEB" stroke="#C0392B" stroke-width="2.5"/>
<text x="315" y="272" text-anchor="middle" font-size="14" fill="#222222">3</text>
<rect x="378" y="250" width="44" height="32" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="400" y="272" text-anchor="middle" font-size="14" fill="#aaaaaa">4</text>
<rect x="463" y="250" width="44" height="32" rx="4" fill="#FCEBEB" stroke="#C0392B" stroke-width="2.5"/>
<text x="485" y="272" text-anchor="middle" font-size="14" fill="#222222">5</text>
<rect x="548" y="250" width="44" height="32" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="570" y="272" text-anchor="middle" font-size="14" fill="#aaaaaa">6</text>
<text x="20" y="330" font-size="14" fill="#C0392B">A = {1, 3, 5}</text>
<text x="20" y="356" font-size="13" fill="#666666">Scattered, with gaps at 2, 4 and 6. Not a run from 1 to 5, and 5 is not a boundary.</text>
<text x="20" y="378" font-size="13" fill="#666666">Position 1 is always in A, since v0v1 is a path edge.</text>
</svg>