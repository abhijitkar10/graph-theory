<line x1="60" y1="170" x2="165" y2="170" stroke="#185FA5" stroke-width="3.6" stroke-linecap="round"/>
<line x1="165" y1="170" x2="290" y2="170" stroke="#185FA5" stroke-width="3.6" stroke-linecap="round"/>
<line x1="290" y1="170" x2="430" y2="170" stroke="#185FA5" stroke-width="3.6" stroke-linecap="round"/>
<line x1="430" y1="170" x2="560" y2="170" stroke="#185FA5" stroke-width="3.6" stroke-linecap="round"/>
<line x1="60" y1="170" x2="165" y2="250" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="165" y1="250" x2="290" y2="250" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="290" y1="250" x2="430" y2="250" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="430" y1="250" x2="560" y2="170" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="60" cy="170" r="6" fill="#333333"/>
<circle cx="560" cy="170" r="6" fill="#333333"/>
<circle cx="165" cy="90" r="6" fill="#333333"/>
<circle cx="165" cy="170" r="6" fill="#333333"/>
<circle cx="165" cy="250" r="6" fill="#333333"/>
<circle cx="290" cy="90" r="6" fill="#333333"/>
<circle cx="290" cy="170" r="6" fill="#333333"/>
<circle cx="290" cy="250" r="6" fill="#333333"/>
<circle cx="430" cy="90" r="6" fill="#333333"/>
<circle cx="430" cy="170" r="6" fill="#333333"/>
<circle cx="430" cy="250" r="6" fill="#333333"/>
<text x="56" y="156" font-size="15" fill="#333333" text-anchor="middle">x</text>
<text x="564" y="156" font-size="15" fill="#333333" text-anchor="middle">y</text>
<text x="165" y="78" font-size="13" fill="#666666" text-anchor="middle">a₁</text>
<text x="290" y="78" font-size="13" fill="#185FA5" text-anchor="middle">s₁</text>
<text x="430" y="78" font-size="13" fill="#666666" text-anchor="middle">t₁</text>
<text x="165" y="158" font-size="13" fill="#666666" text-anchor="middle">a₂</text>
<text x="290" y="158" font-size="13" fill="#185FA5" text-anchor="middle">s₂</text>
<text x="430" y="158" font-size="13" fill="#666666" text-anchor="middle">t₂</text>
<text x="165" y="238" font-size="13" fill="#666666" text-anchor="middle">a₃</text>
<text x="290" y="238" font-size="13" fill="#185FA5" text-anchor="middle">s₃</text>
<text x="430" y="238" font-size="13" fill="#666666" text-anchor="middle">t₃</text>
<text x="60" y="318" font-size="13" fill="#3B6D11" text-anchor="start">R₁ = x a₁ s₁ t₁ y</text>
<text x="250" y="318" font-size="13" fill="#185FA5" text-anchor="start">R₂ = x a₂ s₂ t₂ y</text>
<text x="450" y="318" font-size="13" fill="#C0392B" text-anchor="start">R₃ = x a₃ s₃ t₃ y</text>
<text x="330" y="348" font-size="12" fill="#666666" text-anchor="middle">Each Rᵢ is Pᵢ followed by Qᵢ. The interiors of the P's lie in A, those of the Q's lie in B,</text>
<text x="330" y="368" font-size="12" fill="#666666" text-anchor="middle">and S has one vertex on each.</text>
</svg>
