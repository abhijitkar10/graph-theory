<line x1="165" y1="90" x2="290" y2="90" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="165" y1="170" x2="290" y2="170" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="165" y1="250" x2="290" y2="250" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="290" y1="90" x2="430" y2="90" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="290" y1="170" x2="430" y2="170" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="290" y1="250" x2="430" y2="250" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="430" y1="90" x2="560" y2="170" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="430" y1="170" x2="560" y2="170" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="430" y1="250" x2="560" y2="170" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="165" y1="90" x2="165" y2="170" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="430" y1="170" x2="430" y2="250" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="60" y1="170" x2="165" y2="90" stroke="#3B6D11" stroke-width="3.6" stroke-linecap="round"/>
<line x1="165" y1="90" x2="290" y2="90" stroke="#3B6D11" stroke-width="3.6" stroke-linecap="round"/>
<line x1="290" y1="90" x2="430" y2="90" stroke="#3B6D11" stroke-width="3.6" stroke-linecap="round"/>
