<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392" width="660" height="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="392" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Glue Pᵢ to Qᵢ. The three routes share nothing except x and y.</text>
