<circle cx="470" cy="105" r="7" fill="#C0392B"/>
<circle cx="470" cy="205" r="7" fill="#C0392B"/>
<circle cx="470" cy="325" r="7" fill="#9a9a9a"/>
<circle cx="180" cy="325" r="13" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<circle cx="470" cy="205" r="13" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<circle cx="470" cy="105" r="13" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<text x="158" y="110.0" font-size="14" fill="#C0392B" text-anchor="end">a₁</text>
<text x="158" y="190.0" font-size="14" fill="#C0392B" text-anchor="end">a₂</text>
<text x="158" y="270.0" font-size="14" fill="#C0392B" text-anchor="end">a₃</text>
<text x="158" y="350.0" font-size="14" fill="#666666" text-anchor="end">a₄</text>
<text x="492" y="210.0" font-size="14" fill="#C0392B" text-anchor="start">b₁</text>
<text x="492" y="230.0" font-size="14" fill="#C0392B" text-anchor="start">b₂</text>
<text x="492" y="350.0" font-size="14" fill="#666666" text-anchor="start">b₃</text>
<text x="180" y="288.0" font-size="11" fill="#C0392B" text-anchor="middle">unmatched, so the search starts here</text>
<text x="20" y="388.0" font-size="12" fill="#666666" text-anchor="start">Thick edges lie in M and thin ones do not. Red means reached by the search and grey means never</text>
<text x="20" y="405.0" font-size="12" fill="#666666" text-anchor="start">reached. A blue ring means the vertex goes into the cover C.</text>
<text x="24" y="438.0" font-size="13" fill="#333333" text-anchor="start">a₁b₁</text>
<text x="92" y="438.0" font-size="13" fill="#333333" text-anchor="start">both ends reached</text>
<text x="268" y="438.0" font-size="13" fill="#666666" text-anchor="start">→</text>
<text x="300" y="438.0" font-size="13" fill="#185FA5" text-anchor="start">C takes the B end, b₁</text>
<text x="24" y="460.0" font-size="13" fill="#333333" text-anchor="start">a₂b₂</text>
<text x="92" y="460.0" font-size="13" fill="#333333" text-anchor="start">both ends reached</text>
<text x="268" y="460.0" font-size="13" fill="#666666" text-anchor="start">→</text>
<text x="300" y="460.0" font-size="13" fill="#185FA5" text-anchor="start">C takes the B end, b₂</text>
<text x="24" y="482.0" font-size="13" fill="#333333" text-anchor="start">a₄b₃</text>
<text x="92" y="482.0" font-size="13" fill="#333333" text-anchor="start">neither end reached</text>
<text x="268" y="482.0" font-size="13" fill="#666666" text-anchor="start">→</text>
<text x="300" y="482.0" font-size="13" fill="#185FA5" text-anchor="start">C takes the A end, a₄</text>
<text x="20" y="510.0" font-size="12" fill="#666666" text-anchor="start">Never one of each, so no matching edge gives C both ends or neither, and ∣C∣ = ∣M∣ = 3.</text>
</svg>
