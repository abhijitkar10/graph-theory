<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 528" width="660" height="528" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="528" fill="#ffffff"/>
<text x="20" y="24.0" font-size="13" fill="#666666">Every matching edge is reached at both ends or at neither. That one fact gives Claims 7.3 and</text>
<text x="20" y="44.0" font-size="13" fill="#666666">7.4.</text>
<text x="180" y="78.0" font-size="13" fill="#666666" text-anchor="middle">A</text>
<text x="470" y="78.0" font-size="13" fill="#666666" text-anchor="middle">B</text>
<line x1="180" y1="165" x2="470" y2="105" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="245" x2="470" y2="205" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="85" x2="470" y2="105" stroke="#333333" stroke-width="3.6" stroke-linecap="round"/>
<line x1="180" y1="165" x2="470" y2="205" stroke="#333333" stroke-width="3.6" stroke-linecap="round"/>
<line x1="180" y1="325" x2="470" y2="325" stroke="#333333" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="180" cy="85" r="7" fill="#C0392B"/>
<circle cx="180" cy="165" r="7" fill="#C0392B"/>
<circle cx="180" cy="245" r="7" fill="#C0392B"/>
