<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="350" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Bipartite means two sides with no edge inside either. Colour by parity of distance.</text>
<line x1="90" y1="170" x2="230" y2="100" stroke="#333333" stroke-width="2"/>
<line x1="90" y1="170" x2="230" y2="240" stroke="#333333" stroke-width="2"/>
<line x1="230" y1="100" x2="370" y2="100" stroke="#333333" stroke-width="2"/>
<line x1="230" y1="240" x2="370" y2="240" stroke="#333333" stroke-width="2"/>
<line x1="370" y1="100" x2="510" y2="170" stroke="#333333" stroke-width="2"/>
<line x1="370" y1="240" x2="510" y2="170" stroke="#333333" stroke-width="2"/>
<circle cx="90" cy="170" r="17" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="90" y="175" text-anchor="middle" font-size="13" fill="#222222">0</text>
<circle cx="230" cy="100" r="17" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="230" y="105" text-anchor="middle" font-size="13" fill="#222222">1</text>
<circle cx="230" cy="240" r="17" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="230" y="245" text-anchor="middle" font-size="13" fill="#222222">1</text>
<circle cx="370" cy="100" r="17" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="370" y="105" text-anchor="middle" font-size="13" fill="#222222">2</text>
<circle cx="370" cy="240" r="17" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="370" y="245" text-anchor="middle" font-size="13" fill="#222222">2</text>
<circle cx="510" cy="170" r="17" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="510" y="175" text-anchor="middle" font-size="13" fill="#222222">3</text>
<text x="20" y="286" text-anchor="start" font-size="13" fill="#666666">Numbers are distances from the leftmost vertex. Even distances go blue, odd distances go red.</text>
<text x="20" y="310.0" font-size="13" fill="#666666" text-anchor="start">Every edge steps the distance by one, so it always changes the colour. No edge can join two of</text>
<text x="20" y="330.0" font-size="13" fill="#666666" text-anchor="start">the same colour.</text>
</svg>