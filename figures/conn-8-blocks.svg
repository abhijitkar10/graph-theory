<line x1="215" y1="160" x2="400" y2="160" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="400" y1="160" x2="510" y2="95" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="510" y1="95" x2="510" y2="225" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="510" y1="225" x2="400" y2="160" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="400" y1="160" x2="400" y2="292" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
