<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 308" width="660" height="308" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="308" fill="#ffffff"/>
