<circle cx="510" cy="95" r="5" fill="#333333"/>
<circle cx="510" cy="225" r="5" fill="#333333"/>
<circle cx="400" cy="292" r="5" fill="#333333"/>
<circle cx="215" cy="160" r="7" fill="#C0392B"/>
<circle cx="400" cy="160" r="7" fill="#C0392B"/>
<text x="85" y="100.0" font-size="14" fill="#333333" text-anchor="middle">a</text>
<text x="85" y="165.0" font-size="14" fill="#333333" text-anchor="middle">b</text>
<text x="201" y="209.0" font-size="14" fill="#C0392B" text-anchor="middle">c</text>
<text x="420" y="211.0" font-size="14" fill="#C0392B" text-anchor="middle">d</text>
<text x="530" y="100" font-size="14" fill="#333333" text-anchor="middle">e</text>
<text x="530" y="295.0" font-size="14" fill="#333333" text-anchor="middle">f</text>
<text x="420" y="232.0" font-size="14" fill="#333333" text-anchor="middle">g</text>
<ellipse cx="150" cy="160" rx="78" ry="88" fill="none" stroke="#3B6D11" stroke-width="2" stroke-dasharray="5 4"/>
<text x="150" y="209.0" font-size="14" fill="#3B6D11" text-anchor="middle">B₁</text>
<ellipse cx="307" cy="160" rx="62" ry="22" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="307" y="187.0" font-size="14" fill="#185FA5" text-anchor="middle">B₂</text>
<ellipse cx="465" cy="160" rx="78" ry="88" fill="none" stroke="#3B6D11" stroke-width="2" stroke-dasharray="5 4"/>
<text x="465" y="209.0" font-size="14" fill="#3B6D11" text-anchor="middle">B₃</text>
<ellipse cx="400" cy="226" rx="20" ry="54" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="348" y="167.0" font-size="14" fill="#185FA5" text-anchor="middle">B₄</text>
<text x="330" y="257.0" font-size="12" fill="#666666" text-anchor="middle">c and d in red are the cut vertices. B₂ and B₄ are single edges, so neither is 2-connected</text>
