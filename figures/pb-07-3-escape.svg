<text x="20" y="24" font-size="13" fill="#666666">Claim 7.3. Only two kinds of edge could escape the cover, and both are impossible.</text>
<line x1="180" y1="90" x2="470" y2="110" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="160" x2="470" y2="110" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
