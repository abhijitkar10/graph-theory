<line x1="180" y1="300" x2="470" y2="300" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="90" x2="470" y2="110" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="180" y1="160" x2="470" y2="205" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="180" y1="300" x2="470" y2="300" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="180" cy="90" r="6" fill="#333333"/>
<circle cx="180" cy="160" r="6" fill="#333333"/>
<circle cx="180" cy="230" r="6" fill="#333333"/>
<circle cx="180" cy="300" r="6" fill="#333333"/>
<circle cx="470" cy="110" r="6" fill="#333333"/>
<circle cx="470" cy="205" r="6" fill="#333333"/>
<circle cx="470" cy="300" r="6" fill="#333333"/>
<text x="156" y="95.0" font-size="13" fill="#333333" text-anchor="middle">a₁</text>
<text x="156" y="165.0" font-size="13" fill="#333333" text-anchor="middle">a₂</text>
<text x="156" y="235.0" font-size="13" fill="#333333" text-anchor="middle">a₃</text>
<text x="156" y="305.0" font-size="13" fill="#333333" text-anchor="middle">a₄</text>
<text x="494" y="185.0" font-size="13" fill="#333333" text-anchor="middle">b₁</text>
<text x="494" y="210.0" font-size="13" fill="#333333" text-anchor="middle">b₂</text>
<text x="494" y="305.0" font-size="13" fill="#333333" text-anchor="middle">b₃</text>
<text x="180" y="56" font-size="14" fill="#666666" text-anchor="middle">A</text>
<text x="470" y="76" font-size="14" fill="#666666" text-anchor="middle">B</text>
<circle cx="180" cy="160" r="13" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<text x="130" y="230.0" font-size="11" fill="#185FA5" text-anchor="end">a is reached</text>
<circle cx="470" cy="300" r="13" fill="none" stroke="#185FA5" stroke-width="2.6" stroke-dasharray="4 3"/>
<text x="520" y="300.0" font-size="11" fill="#185FA5" text-anchor="start">b was not</text>
<text x="330" y="352.0" font-size="12" fill="#666666" text-anchor="middle">if ab is outside M: the search sitting at a would have stepped along it and reached b</text>
<text x="330" y="374.0" font-size="12" fill="#666666" text-anchor="middle">if ab is inside M: then b is a's partner, so b was reached before a ever was</text>
<text x="330" y="404.0" font-size="12" fill="#666666" text-anchor="middle">Either way you contradict something you already know, so no edge escapes and C really is a</text>
<text x="330" y="424.0" font-size="12" fill="#666666" text-anchor="middle">cover.</text>
