<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="340" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">A maximal trail cannot be open. Suppose a trail runs a b c d and stops.</text>
<line x1="170" y1="90" x2="170" y2="230" stroke="#bbbbbb" stroke-width="2"/>
<line x1="170" y1="90" x2="330" y2="160" stroke="#bbbbbb" stroke-width="2"/>
<line x1="170" y1="230" x2="330" y2="160" stroke="#bbbbbb" stroke-width="2"/>
<line x1="330" y1="160" x2="490" y2="90" stroke="#bbbbbb" stroke-width="2"/>
<line x1="330" y1="160" x2="490" y2="230" stroke="#bbbbbb" stroke-width="2"/>
<line x1="490" y1="90" x2="490" y2="230" stroke="#bbbbbb" stroke-width="2"/>
<line x1="170" y1="90" x2="170" y2="230" stroke="#333333" stroke-width="3.5"/>
<line x1="170" y1="230" x2="330" y2="160" stroke="#333333" stroke-width="3.5"/>
<line x1="330" y1="160" x2="490" y2="90" stroke="#333333" stroke-width="3.5"/>
<line x1="490" y1="90" x2="490" y2="230" stroke="#C0392B" stroke-width="3.5" stroke-dasharray="6 4"/>
<circle cx="170" cy="90" r="17" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="170" y="95" text-anchor="middle" font-size="14" fill="#222222">a</text>
<circle cx="170" cy="230" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="170" y="235" text-anchor="middle" font-size="14" fill="#222222">b</text>
<circle cx="330" cy="160" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="330" y="165" text-anchor="middle" font-size="14" fill="#222222">c</text>
<circle cx="490" cy="90" r="19" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="490" y="95" text-anchor="middle" font-size="14" fill="#222222">d</text>
<circle cx="490" cy="230" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="490" y="235" text-anchor="middle" font-size="14" fill="#222222">e</text>
<text x="530" y="164" font-size="12" fill="#C0392B">unused</text>
<text x="20" y="290" font-size="13" fill="#666666">At the end vertex d the trail has used just one edge, cd. But d has degree 2, which is even.</text>
<text x="20" y="314" font-size="13" fill="#C0392B">Even minus odd leaves something over, so an unused edge must sit at d. Take it, and the trail was not maximal.</text>
</svg>