<text x="215" y="236" font-size="12" fill="#666666" text-anchor="middle">the cycle</text>
<line x1="452" y1="232" x2="296.89394462327317" y2="250.69175845233042" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
<circle cx="452" cy="232" r="7" fill="#C0392B"/>
<text x="456" y="212" font-size="15" fill="#C0392B" text-anchor="middle">w</text>
<text x="378" y="258" font-size="11" fill="#C0392B" text-anchor="middle">forced</text>
<text x="330" y="392.0" font-size="12" fill="#666666" text-anchor="middle">The cycle already carries at least n/2 + 1 vertices, so off it there are fewer than n/2 − 1 other places for</text>
<text x="330" y="412.0" font-size="12" fill="#666666" text-anchor="middle">w's neighbours to sit. But w has at least n/2 of them,</text>
<text x="330" y="432" font-size="12" fill="#666666" text-anchor="middle">so at least one neighbour must land on the cycle.</text>
<text x="330" y="458" font-size="12" fill="#C0392B" text-anchor="middle">Snip one cycle edge there, and w hangs off the open end: a path of length k+1,</text>
<text x="330" y="476" font-size="12" fill="#C0392B" text-anchor="middle">longer than P. Contradiction, so nothing sits outside.</text>
