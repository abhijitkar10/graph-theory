<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 452" width="660" height="452" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="452" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The running example. Two triangles sharing the vertex c. Every degree is even.</text>
<line x1="170" y1="105" x2="170" y2="265" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="170" y1="265" x2="330" y2="185" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="330" y1="185" x2="490" y2="105" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="490" y1="105" x2="490" y2="265" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="490" y1="265" x2="330" y2="185" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="330" y1="185" x2="170" y2="105" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="170.0" cy="185.0" r="11" fill="#ffffff"/>
<text x="170.0" y="190.0" font-size="13" fill="#3B6D11" text-anchor="middle">1</text>
<circle cx="250.0" cy="225.0" r="11" fill="#ffffff"/>
<text x="250.0" y="230.0" font-size="13" fill="#3B6D11" text-anchor="middle">2</text>
<circle cx="410.0" cy="145.0" r="11" fill="#ffffff"/>
<text x="410.0" y="150.0" font-size="13" fill="#3B6D11" text-anchor="middle">3</text>
<circle cx="490.0" cy="185.0" r="11" fill="#ffffff"/>
<text x="490.0" y="190.0" font-size="13" fill="#3B6D11" text-anchor="middle">4</text>
<circle cx="410.0" cy="225.0" r="11" fill="#ffffff"/>
<text x="410.0" y="230.0" font-size="13" fill="#3B6D11" text-anchor="middle">5</text>
<circle cx="250.0" cy="145.0" r="11" fill="#ffffff"/>
<text x="250.0" y="150.0" font-size="13" fill="#3B6D11" text-anchor="middle">6</text>
<circle cx="170" cy="105" r="7" fill="#333333"/>
<circle cx="170" cy="265" r="7" fill="#333333"/>
<circle cx="330" cy="185" r="7" fill="#333333"/>
<circle cx="490" cy="105" r="7" fill="#333333"/>
<circle cx="490" cy="265" r="7" fill="#333333"/>
<text x="152" y="110" font-size="15" fill="#333333" text-anchor="end">a</text>
<text x="152" y="270" font-size="15" fill="#333333" text-anchor="end">b</text>
<text x="330" y="217" font-size="15" fill="#333333" text-anchor="middle">c</text>
<text x="508" y="110" font-size="15" fill="#333333" text-anchor="start">d</text>
<text x="508" y="270" font-size="15" fill="#333333" text-anchor="start">e</text>
<text x="152" y="87" font-size="11" fill="#666666" text-anchor="end">degree 2</text>
<text x="152" y="295" font-size="11" fill="#666666" text-anchor="end">degree 2</text>
<text x="508" y="87" font-size="11" fill="#666666" text-anchor="start">degree 2</text>
<text x="508" y="295" font-size="11" fill="#666666" text-anchor="start">degree 2</text>
<text x="330" y="237" font-size="11" fill="#666666" text-anchor="middle">degree 4</text>
<text x="330" y="360" font-size="13" fill="#3B6D11" text-anchor="middle">The numbers give one Euler circuit: a b c d e c a. It uses all six edges, once each,</text>
<text x="330" y="382" font-size="13" fill="#3B6D11" text-anchor="middle">and finishes where it began.</text>
<text x="330" y="418" font-size="12" fill="#666666" text-anchor="middle">Notice c is visited twice. That is allowed: a circuit may repeat vertices, never edges.</text>
</svg>
