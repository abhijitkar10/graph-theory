<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="360" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The running example. Two triangles sharing the vertex c. Every degree is even.</text>
<line x1="170" y1="90" x2="170" y2="230" stroke="#333333" stroke-width="2"/>
<line x1="170" y1="90" x2="330" y2="160" stroke="#333333" stroke-width="2"/>
<line x1="170" y1="230" x2="330" y2="160" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="160" x2="490" y2="90" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="160" x2="490" y2="230" stroke="#333333" stroke-width="2"/>
<line x1="490" y1="90" x2="490" y2="230" stroke="#333333" stroke-width="2"/>
<circle cx="170" cy="160" r="11" fill="#ffffff" stroke="#3B6D11" stroke-width="1.5"/>
<text x="170" y="164" text-anchor="middle" font-size="11" fill="#3B6D11">1</text>
<circle cx="250" cy="195" r="11" fill="#ffffff" stroke="#3B6D11" stroke-width="1.5"/>
<text x="250" y="199" text-anchor="middle" font-size="11" fill="#3B6D11">2</text>
<circle cx="410" cy="125" r="11" fill="#ffffff" stroke="#3B6D11" stroke-width="1.5"/>
<text x="410" y="129" text-anchor="middle" font-size="11" fill="#3B6D11">3</text>
<circle cx="490" cy="160" r="11" fill="#ffffff" stroke="#3B6D11" stroke-width="1.5"/>
<text x="490" y="164" text-anchor="middle" font-size="11" fill="#3B6D11">4</text>
<circle cx="410" cy="195" r="11" fill="#ffffff" stroke="#3B6D11" stroke-width="1.5"/>
<text x="410" y="199" text-anchor="middle" font-size="11" fill="#3B6D11">5</text>
<circle cx="250" cy="125" r="11" fill="#ffffff" stroke="#3B6D11" stroke-width="1.5"/>
<text x="250" y="129" text-anchor="middle" font-size="11" fill="#3B6D11">6</text>
<circle cx="170" cy="90" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="170" y="95" text-anchor="middle" font-size="14" fill="#222222">a</text>
<circle cx="170" cy="230" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="170" y="235" text-anchor="middle" font-size="14" fill="#222222">b</text>
<circle cx="330" cy="160" r="19" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="330" y="165" text-anchor="middle" font-size="14" fill="#222222">c</text>
<circle cx="490" cy="90" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="490" y="95" text-anchor="middle" font-size="14" fill="#222222">d</text>
<circle cx="490" cy="230" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="490" y="235" text-anchor="middle" font-size="14" fill="#222222">e</text>
<text x="170" y="60" text-anchor="middle" font-size="12" fill="#888888">degree 2</text>
<text x="170" y="270" text-anchor="middle" font-size="12" fill="#888888">degree 2</text>
<text x="330" y="205" text-anchor="middle" font-size="12" fill="#3B6D11">degree 4</text>
<text x="490" y="60" text-anchor="middle" font-size="12" fill="#888888">degree 2</text>
<text x="490" y="270" text-anchor="middle" font-size="12" fill="#888888">degree 2</text>
<text x="20" y="316" font-size="13" fill="#3B6D11">Numbers give one Euler circuit: a b c d e c a. It uses all six edges, once each, and finishes where it began.</text>
<text x="20" y="340" font-size="13" fill="#666666">Notice c is visited twice. That is allowed. A circuit may repeat vertices, never edges.</text>
</svg>