<text x="122" y="200" font-size="14" fill="#185FA5" text-anchor="middle">S</text>
<ellipse cx="470" cy="201" rx="38" ry="148" fill="none" stroke="#3B6D11" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="538" y="201" font-size="13" fill="#3B6D11" text-anchor="middle">N(S)</text>
<text x="330" y="60" font-size="12" fill="#666666" text-anchor="middle">k = 3 here, and S has two vertices</text>
<text x="330" y="410.0" font-size="12" fill="#666666" text-anchor="middle">Exactly k∣S∣ = 6 edges leave S, since every vertex of S has degree 3 and every one of its edges goes to</text>
<text x="330" y="430.0" font-size="12" fill="#666666" text-anchor="middle">B. They all land in N(S), and each vertex there has degree 3 in total, some</text>
<text x="330" y="450" font-size="12" fill="#666666" text-anchor="middle">possibly used up by A outside S. So N(S) receives at most k∣N(S)∣, giving ∣S∣ ≤ ∣N(S)∣.</text>
