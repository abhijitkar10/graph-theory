<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="420" fill="#ffffff"/>
<text x="20" y="24.0" font-size="13" fill="#666666">Claim 24.2. Peel off the vertex Question 23 gives you, and the matching number drops by</text>
<text x="20" y="44.0" font-size="13" fill="#666666">exactly one.</text>
<ellipse cx="200" cy="180" rx="110" ry="80" fill="none" stroke="#333333" stroke-width="2.4"/>
<text x="200" y="92.0" font-size="13" fill="#333333" text-anchor="middle">G, with α′ = k</text>
<circle cx="316" cy="180" r="8" fill="#C0392B"/>
<text x="320" y="178.0" font-size="15" fill="#C0392B" text-anchor="middle">v</text>
<text x="316" y="234.0" font-size="11" fill="#C0392B" text-anchor="middle">in every maximum matching</text>
<text x="400" y="200.0" font-size="24" fill="#666666" text-anchor="middle">→</text>
<ellipse cx="520" cy="180" rx="90" ry="72" fill="none" stroke="#333333" stroke-width="2.4"/>
<text x="520" y="200.0" font-size="13" fill="#333333" text-anchor="middle">G − v</text>
<text x="520" y="288.0" font-size="13" fill="#3B6D11" text-anchor="middle">α′ = k − 1</text>
<text x="330" y="324.0" font-size="12" fill="#666666" text-anchor="middle">It cannot still be k: a matching of that size in G − v would be a maximum matching of G</text>
<text x="330" y="344.0" font-size="12" fill="#666666" text-anchor="middle">avoiding v, which is exactly what v was chosen to make impossible. And it is at least k−1,</text>
<text x="330" y="364.0" font-size="12" fill="#666666" text-anchor="middle">because deleting v's own edge from a maximum matching of G leaves k−1 edges that avoid v.</text>
</svg>
