<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370" width="660" height="370" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="370" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Question 10. Take a shortest path between two non-adjacent vertices, read its first three.</text>
<line x1="110" y1="170" x2="230" y2="170" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="230" y1="170" x2="350" y2="170" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="350" y1="170" x2="470" y2="170" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="470" y1="170" x2="560" y2="170" stroke="#c4c4c4" stroke-width="2.4" stroke-linecap="round"/>
<line x1="110" y1="170" x2="230" y2="170" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="230" y1="170" x2="350" y2="170" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="110" cy="170" r="6" fill="#333333"/>
<circle cx="230" cy="170" r="6" fill="#333333"/>
<circle cx="350" cy="170" r="6" fill="#333333"/>
<circle cx="470" cy="170" r="6" fill="#333333"/>
<circle cx="560" cy="170" r="6" fill="#333333"/>
<text x="110" y="196" font-size="13" fill="#333333" text-anchor="middle">u = a</text>
<text x="230" y="196" font-size="13" fill="#333333" text-anchor="middle">b</text>
<text x="350" y="196" font-size="13" fill="#333333" text-anchor="middle">c</text>
<text x="560" y="196" font-size="13" fill="#333333" text-anchor="middle">w</text>
<path d="M 110 170 Q 230.0 118.0 350 170" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="230" y="96" font-size="12" fill="#185FA5" text-anchor="middle">if ac existed it would shortcut the path</text>
<text x="330" y="224" font-size="11" fill="#c4c4c4" text-anchor="middle">u and w are not adjacent, which is why a path is needed at all</text>
<text x="330" y="262.0" font-size="12" fill="#666666" text-anchor="middle">Not complete gives you a non-adjacent pair u, w. Connected gives you a path between them, and a</text>
<text x="330" y="282.0" font-size="12" fill="#666666" text-anchor="middle">shortest one has length at least 2. Its first three vertices a, b, c have ab and bc as</text>
<text x="330" y="302" font-size="12" fill="#666666" text-anchor="middle">edges, and ac cannot be one, since skipping b would give a shorter u to w path.</text>
</svg>
