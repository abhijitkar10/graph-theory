<circle cx="402" cy="118" r="6" fill="#333333"/>
<text x="402" y="100" font-size="13" fill="#333333" text-anchor="middle">v₄</text>
<circle cx="480" cy="118" r="6" fill="#333333"/>
<text x="480" y="100" font-size="13" fill="#333333" text-anchor="middle">v₅</text>
<circle cx="558" cy="118" r="6" fill="#333333"/>
<text x="558" y="100" font-size="13" fill="#333333" text-anchor="middle">v₆</text>
<path d="M 90 118 Q 207.0 166.0 324 118" fill="none" stroke="#3B6D11" stroke-width="2.6" stroke-linecap="round"/>
