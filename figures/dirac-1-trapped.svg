<text x="480" y="312" font-size="13" fill="#333333" text-anchor="middle">v₅</text>
<circle cx="558" cy="330" r="6" fill="#333333"/>
<text x="558" y="312" font-size="13" fill="#333333" text-anchor="middle">v₆</text>
<path d="M 558 330 Q 480.0 378.0 402 330" fill="none" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 558 330 Q 402.0 402.0 246 330" fill="none" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 558 330 Q 363.0 426.0 168 330" fill="none" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<text x="330" y="466" font-size="12" fill="#666666" text-anchor="middle">v₆ reaches v₅ along the path, and v₄, v₂, v₁ by these arcs. Four neighbours, every one on P.</text>
<text x="330" y="502" font-size="12" fill="#666666" text-anchor="middle">A neighbour sitting off the path could be tacked onto that end, giving a longer path.</text>
<text x="330" y="522" font-size="12" fill="#666666" text-anchor="middle">P was chosen longest, so both endpoints are trapped on it.</text>
</svg>
