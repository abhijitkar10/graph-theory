<text x="56" y="82" font-size="11" fill="#C0392B" text-anchor="start">nothing out here</text>
<text x="330" y="254" font-size="12" fill="#666666" text-anchor="middle">v₀ reaches v₁ along the path, and v₃, v₄, v₅ by these arcs. Four neighbours, every one on P.</text>
