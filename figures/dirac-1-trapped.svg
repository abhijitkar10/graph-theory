<line x1="480" y1="330" x2="558" y2="330" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
<circle cx="90" cy="330" r="6" fill="#333333"/>
<text x="90" y="312" font-size="13" fill="#333333" text-anchor="middle">v₀</text>
<circle cx="168" cy="330" r="6" fill="#333333"/>
<text x="168" y="312" font-size="13" fill="#333333" text-anchor="middle">v₁</text>
<circle cx="246" cy="330" r="6" fill="#333333"/>
<text x="246" y="312" font-size="13" fill="#333333" text-anchor="middle">v₂</text>
