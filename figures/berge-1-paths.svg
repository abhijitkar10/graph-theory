<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="360" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Alternating means the edges take turns. Augmenting adds the condition that both ends are unmatched.</text>
<line x1="80" y1="110" x2="200" y2="110" stroke="#333333" stroke-width="2"/>
<line x1="200" y1="110" x2="320" y2="110" stroke="#3B6D11" stroke-width="4"/>
<line x1="320" y1="110" x2="440" y2="110" stroke="#333333" stroke-width="2"/>
<line x1="440" y1="110" x2="560" y2="110" stroke="#3B6D11" stroke-width="4"/>
<circle cx="80" cy="110" r="11" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="80" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="200" cy="110" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="200" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="320" cy="110" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="320" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="440" cy="110" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="440" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="560" cy="110" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="560" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<text x="80" y="142" text-anchor="middle" font-size="12" fill="#333333">free</text>
<text x="560" y="142" text-anchor="middle" font-size="12" fill="#3B6D11">matched</text>
<text x="20" y="182" text-anchor="start" font-size="13" fill="#666666">Alternating, but not augmenting. The right hand end already has a matching edge.</text>
<line x1="80" y1="250" x2="200" y2="250" stroke="#333333" stroke-width="2"/>
<line x1="200" y1="250" x2="320" y2="250" stroke="#3B6D11" stroke-width="4"/>
<line x1="320" y1="250" x2="440" y2="250" stroke="#333333" stroke-width="2"/>
<line x1="440" y1="250" x2="560" y2="250" stroke="#3B6D11" stroke-width="4"/>
<line x1="560" y1="250" x2="640" y2="250" stroke="#333333" stroke-width="2"/>
<circle cx="80" cy="250" r="11" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<text x="80" y="254" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="200" cy="250" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="200" y="254" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="320" cy="250" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="320" y="254" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="440" cy="250" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="440" y="254" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="560" cy="250" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="560" y="254" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="640" cy="250" r="11" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<text x="640" y="254" text-anchor="middle" font-size="12" fill="#222222"></text>
<text x="80" y="282" text-anchor="middle" font-size="12" fill="#C0392B">free</text>
<text x="640" y="282" text-anchor="middle" font-size="12" fill="#C0392B">free</text>
<text x="20" y="322" text-anchor="start" font-size="13" fill="#C0392B">Augmenting. Both ends are free, so it has an odd number of edges and one more outside the matching than inside.</text>
<text x="20" y="346" text-anchor="start" font-size="13" fill="#3B6D11">Swap them and the matching gains exactly one edge.</text>
</svg>