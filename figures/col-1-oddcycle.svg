<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="300" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">C₅ cannot be coloured with two colours: the colours are forced round the cycle.</text>
<line x1="330" y1="60" x2="406" y2="115" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="406" y1="115" x2="377" y2="205" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="377" y1="205" x2="283" y2="205" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="283" y1="205" x2="254" y2="115" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="254" y1="115" x2="330" y2="60" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="254" y1="115" x2="330" y2="60" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/>
<line x1="283" y1="205" x2="254" y2="115" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="330" cy="60" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="330" y="65" font-size="13" fill="#333333" text-anchor="middle">v₁</text>
<circle cx="406" cy="115" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="406" y="120" font-size="13" fill="#333333" text-anchor="middle">v₂</text>
<circle cx="377" cy="205" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="377" y="210" font-size="13" fill="#333333" text-anchor="middle">v₃</text>
<circle cx="283" cy="205" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="283" y="210" font-size="13" fill="#333333" text-anchor="middle">v₄</text>
<circle cx="254" cy="115" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="254" y="120" font-size="13" fill="#333333" text-anchor="middle">v₅</text>
<text x="330" y="230" font-size="12" fill="#C0392B" text-anchor="middle">v₅ is next to v₄ (colour 2) and v₁ (colour 1)</text>
<text x="330" y="255" font-size="12" fill="#666666" text-anchor="middle">Colours alternate 1, 2, 1, 2 along v₁ to v₄, so v₅ has no colour left from {1, 2}. A third</text>
<text x="330" y="275" font-size="12" fill="#666666" text-anchor="middle">colour is needed.</text>
</svg>
