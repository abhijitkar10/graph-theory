<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 414" width="660" height="414" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="414" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 8.2. Run it backwards: from a minimum cover, build a set of A that is starved.</text>
<ellipse cx="170" cy="176" rx="62" ry="106" fill="none" stroke="#333333" stroke-width="2"/>
<text x="170" y="56" font-size="14" fill="#666666" text-anchor="middle">A</text>
<ellipse cx="490" cy="176" rx="62" ry="106" fill="none" stroke="#333333" stroke-width="2"/>
<text x="490" y="56" font-size="14" fill="#666666" text-anchor="middle">B</text>
<ellipse cx="170" cy="124" rx="42" ry="40" fill="none" stroke="#C0392B" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="170" y="128" font-size="12" fill="#C0392B" text-anchor="middle">K ∩ A</text>
<ellipse cx="490" cy="146" rx="42" ry="40" fill="none" stroke="#C0392B" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="490" y="150" font-size="12" fill="#C0392B" text-anchor="middle">K ∩ B</text>
<ellipse cx="170" cy="228" rx="42" ry="40" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<text x="170" y="232" font-size="13" fill="#185FA5" text-anchor="middle">S</text>
<line x1="212" y1="216" x2="448" y2="144" stroke="#3B6D11" stroke-width="1.8" stroke-linecap="round"/>
<line x1="212" y1="228" x2="448" y2="150" stroke="#3B6D11" stroke-width="1.8" stroke-linecap="round"/>
<line x1="212" y1="240" x2="448" y2="156" stroke="#3B6D11" stroke-width="1.8" stroke-linecap="round"/>
<text x="330" y="268.0" font-size="11" fill="#3B6D11" text-anchor="middle">nothing covers these from the A end, so they must be covered inside K ∩ B</text>
<text x="330" y="310.0" font-size="12" fill="#666666" text-anchor="middle">S is the part of A lying outside the cover, so N(S) sits inside K ∩ B. Counting, ∣N(S)∣ is at</text>
<text x="330" y="330.0" font-size="12" fill="#666666" text-anchor="middle">most ∣K∣ − ∣K ∩ A∣, while ∣S∣ equals ∣A∣ − ∣K ∩ A∣. The matching failed to saturate A, so ∣K∣</text>
<text x="330" y="350.0" font-size="12" fill="#666666" text-anchor="middle">is smaller than ∣A∣. Subtract the same amount from both and N(S) comes out strictly smaller</text>
<text x="330" y="370.0" font-size="12" fill="#666666" text-anchor="middle">than S.</text>
</svg>
