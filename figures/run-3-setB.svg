<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="430" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Set B does the same from the far end, but records one position to the right.</text>
<path d="M 570 150 Q 400 290 230 150" fill="none" stroke="#185FA5" stroke-width="2.5"/>
<path d="M 570 150 Q 485 220 400 150" fill="none" stroke="#185FA5" stroke-width="2.5"/>
<line x1="485" y1="150" x2="570" y2="150" stroke="#185FA5" stroke-width="5"/>
<line x1="60" y1="150" x2="570" y2="150" stroke="#333333" stroke-width="2"/>
<circle cx="60" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="145" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="230" cy="150" r="8" fill="#185FA5" stroke="#185FA5" stroke-width="2"/>
<circle cx="315" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="400" cy="150" r="8" fill="#185FA5" stroke="#185FA5" stroke-width="2"/>
<circle cx="485" cy="150" r="8" fill="#185FA5" stroke="#185FA5" stroke-width="2"/>
<circle cx="570" cy="150" r="8" fill="#185FA5" stroke="#185FA5" stroke-width="2"/>
<text x="60" y="180" text-anchor="middle" font-size="13" fill="#888888">v0</text>
<text x="145" y="180" text-anchor="middle" font-size="13" fill="#888888">v1</text>
<text x="230" y="180" text-anchor="middle" font-size="13" fill="#185FA5">v2</text>
<text x="315" y="180" text-anchor="middle" font-size="13" fill="#888888">v3</text>
<text x="400" y="180" text-anchor="middle" font-size="13" fill="#185FA5">v4</text>
<text x="485" y="180" text-anchor="middle" font-size="13" fill="#185FA5">v5</text>
<text x="570" y="180" text-anchor="middle" font-size="13" fill="#185FA5">v6</text>
<text x="20" y="272" font-size="13" fill="#185FA5">v6 joins v2, v4 and v5. Shift each by one: mark 3, 5 and 6.</text>
<rect x="123" y="290" width="44" height="32" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="145" y="312" text-anchor="middle" font-size="14" fill="#aaaaaa">1</text>
<rect x="208" y="290" width="44" height="32" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="230" y="312" text-anchor="middle" font-size="14" fill="#aaaaaa">2</text>
<rect x="293" y="290" width="44" height="32" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
<text x="315" y="312" text-anchor="middle" font-size="14" fill="#222222">3</text>
<rect x="378" y="290" width="44" height="32" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="400" y="312" text-anchor="middle" font-size="14" fill="#aaaaaa">4</text>
<rect x="463" y="290" width="44" height="32" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
<text x="485" y="312" text-anchor="middle" font-size="14" fill="#222222">5</text>
<rect x="548" y="290" width="44" height="32" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.5"/>
<text x="570" y="312" text-anchor="middle" font-size="14" fill="#222222">6</text>
<path d="M 230 268 L 309 282" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="309" cy="282" r="3" fill="#185FA5"/>
<path d="M 400 268 L 479 282" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="479" cy="282" r="3" fill="#185FA5"/>
<path d="M 485 268 L 564 282" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="564" cy="282" r="3" fill="#185FA5"/>
<text x="20" y="368" font-size="14" fill="#185FA5">B = {3, 5, 6}</text>
<text x="20" y="394" font-size="13" fill="#666666">The dashed arrows slant right. That slant is the whole meaning of the minus one.</text>
<text x="20" y="416" font-size="13" fill="#666666">Position 6 is always in B, since v5v6 is a path edge.</text>
</svg>