<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="330" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The ceiling and the extreme case.</text>
<line x1="160" y1="150" x2="70" y2="80" stroke="#bbbbbb" stroke-width="2"/>
<line x1="160" y1="150" x2="70" y2="150" stroke="#bbbbbb" stroke-width="2"/>
<line x1="160" y1="150" x2="70" y2="220" stroke="#bbbbbb" stroke-width="2"/>
<line x1="160" y1="150" x2="250" y2="80" stroke="#bbbbbb" stroke-width="2"/>
<line x1="160" y1="150" x2="250" y2="220" stroke="#bbbbbb" stroke-width="2"/>
<line x1="160" y1="150" x2="70" y2="80" stroke="#3B6D11" stroke-width="3.5"/>
<circle cx="70" cy="80" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="70" y="85" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="70" cy="150" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="70" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="70" cy="220" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="70" y="225" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="250" cy="80" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="250" y="85" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="250" cy="220" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="250" y="225" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="160" cy="150" r="12" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="160" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="160" y="262" text-anchor="middle" font-size="12" fill="#666666">star: every edge hits the centre, so only one can be chosen</text>
<line x1="400" y1="150" x2="460" y2="150" stroke="#bbbbbb" stroke-width="2"/>
<line x1="460" y1="150" x2="520" y2="150" stroke="#bbbbbb" stroke-width="2"/>
<line x1="520" y1="150" x2="580" y2="150" stroke="#bbbbbb" stroke-width="2"/>
<line x1="580" y1="150" x2="640" y2="150" stroke="#bbbbbb" stroke-width="2"/>
<line x1="400" y1="150" x2="460" y2="150" stroke="#3B6D11" stroke-width="3.5"/>
<line x1="520" y1="150" x2="580" y2="150" stroke="#3B6D11" stroke-width="3.5"/>
<circle cx="400" cy="150" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="400" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="460" cy="150" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="460" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="520" cy="150" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="520" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="580" cy="150" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="580" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="640" cy="150" r="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="640" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="520" y="262" text-anchor="middle" font-size="12" fill="#666666">path on 5 vertices: two disjoint edges</text>
<text x="20" y="296" text-anchor="start" font-size="13" fill="#666666">A matching of size v uses 2v distinct vertices, so it can never exceed n over 2 rounded down.</text>
<text x="20" y="320" text-anchor="start" font-size="13" fill="#C0392B">The star is the extreme: however large it grows, its maximum matching stays at 1.</text>
</svg>