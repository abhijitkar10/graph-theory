<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="400" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The crossed out step fails, and k is sharp. Both are shown by K₂,₃, which is 2-connected.</text>
<text x="175" y="62" font-size="14" fill="#C0392B" text-anchor="middle">The path R from a to b</text>
<text x="505" y="62" font-size="14" fill="#185FA5" text-anchor="middle">Three vertices on no common cycle</text>
<line x1="40" y1="290" x2="90" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="290" x2="250" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="290" x2="90" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="290" x2="250" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="300" y1="290" x2="90" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="300" y1="290" x2="250" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="40" y1="290" x2="90" y2="130" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="90" y1="130" x2="170" y2="290" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="170" y1="290" x2="250" y2="130" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<line x1="250" y1="130" x2="300" y2="290" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="90" cy="130" r="7" fill="#C0392B"/>
<text x="90" y="116" font-size="15" fill="#C0392B" text-anchor="middle">u</text>
<circle cx="250" cy="130" r="7" fill="#C0392B"/>
<text x="250" y="116" font-size="15" fill="#C0392B" text-anchor="middle">v</text>
<circle cx="40" cy="290" r="7" fill="#C0392B"/>
<text x="40" y="316" font-size="15" fill="#C0392B" text-anchor="middle">a</text>
<circle cx="170" cy="290" r="7" fill="#C0392B"/>
<text x="170" y="316" font-size="15" fill="#C0392B" text-anchor="middle">c</text>
<circle cx="300" cy="290" r="7" fill="#C0392B"/>
<text x="300" y="316" font-size="15" fill="#C0392B" text-anchor="middle">b</text>
<line x1="370" y1="290" x2="420" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="370" y1="290" x2="580" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="500" y1="290" x2="420" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="500" y1="290" x2="580" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="630" y1="290" x2="420" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<line x1="630" y1="290" x2="580" y2="130" stroke="#bbbbbb" stroke-width="2" stroke-linecap="round"/>
<circle cx="420" cy="130" r="7" fill="#333333"/>
<text x="420" y="116" font-size="15" fill="#666666" text-anchor="middle">u</text>
<circle cx="580" cy="130" r="7" fill="#333333"/>
<text x="580" y="116" font-size="15" fill="#666666" text-anchor="middle">v</text>
<circle cx="370" cy="290" r="7" fill="#185FA5"/>
<text x="370" y="316" font-size="15" fill="#185FA5" text-anchor="middle">a</text>
<circle cx="500" cy="290" r="7" fill="#185FA5"/>
<text x="500" y="316" font-size="15" fill="#185FA5" text-anchor="middle">c</text>
<circle cx="630" cy="290" r="7" fill="#185FA5"/>
<text x="630" y="316" font-size="15" fill="#185FA5" text-anchor="middle">b</text>
<text x="175" y="334" font-size="12" fill="#666666" text-anchor="middle">R = a, u, c, v, b uses all five vertices. A</text>
<text x="175" y="354" font-size="12" fill="#666666" text-anchor="middle">second a to b path avoiding its interior has</text>
<text x="175" y="374" font-size="12" fill="#666666" text-anchor="middle">nowhere to go, and ab is not an edge.</text>
<text x="505" y="334" font-size="12" fill="#666666" text-anchor="middle">A cycle in K₂,₃ alternates top and bottom.</text>
<text x="505" y="354" font-size="12" fill="#666666" text-anchor="middle">One through a, b and c would need three top</text>
<text x="505" y="374" font-size="12" fill="#666666" text-anchor="middle">vertices, and there are only two.</text>
</svg>
