<text x="330" y="398" font-size="12" fill="#666666" text-anchor="middle">Each contracted graph has fewer vertices than G exactly when the contracted side has at least</text>
<text x="330" y="418" font-size="12" fill="#666666" text-anchor="middle">two vertices, which is what lets the induction hypothesis apply.</text>
</svg>
