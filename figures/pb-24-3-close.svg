<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 393" width="660" height="393" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="393" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 24.3. The k−1 vertices the induction hands back still work in G, and v is a new one.</text>
<ellipse cx="230" cy="170" rx="120" ry="82" fill="none" stroke="#333333" stroke-width="2.4"/>
<text x="230" y="64" font-size="12" fill="#333333" text-anchor="middle">G − v, cover number k−1</text>
<circle cx="180" cy="150" r="7" fill="#3B6D11"/>
<circle cx="230" cy="190" r="7" fill="#3B6D11"/>
<circle cx="280" cy="150" r="7" fill="#3B6D11"/>
<text x="230" y="238" font-size="11" fill="#3B6D11" text-anchor="middle">k−1 vertices in every maximum matching of G − v</text>
<circle cx="470" cy="170" r="8" fill="#C0392B"/>
<text x="470" y="148" font-size="15" fill="#C0392B" text-anchor="middle">v</text>
<text x="470" y="204.0" font-size="11" fill="#C0392B" text-anchor="middle">not one of them,</text>
<text x="470" y="223.0" font-size="11" fill="#C0392B" text-anchor="middle">since it is not in G − v</text>
<text x="330" y="291.0" font-size="12" fill="#666666" text-anchor="middle">Take any maximum matching M of G. It has an edge at v, and deleting that edge leaves a maximum</text>
<text x="330" y="311.0" font-size="12" fill="#666666" text-anchor="middle">matching of G − v, so all k−1 vertices lie in it and therefore in M. Add v itself and you have</text>
<text x="330" y="331.0" font-size="12" fill="#666666" text-anchor="middle">k.</text>
</svg>
