<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="420" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Konigsberg. Four land masses, seven bridges.</text>
<path d="M 330 80 Q 218 106 140 190" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 330 80 Q 252 164 140 190" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 330 80 Q 408 164 520 190" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M 330 80 Q 442 106 520 190" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="80" x2="330" y2="300" stroke="#333333" stroke-width="2"/>
<line x1="140" y1="190" x2="330" y2="300" stroke="#333333" stroke-width="2"/>
<line x1="520" y1="190" x2="330" y2="300" stroke="#333333" stroke-width="2"/>
<circle cx="330" cy="80" r="20" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="330" y="85" text-anchor="middle" font-size="14" fill="#222222">A</text>
<text x="330" y="118" text-anchor="middle" font-size="12" fill="#C0392B">degree 5, odd</text>
<circle cx="140" cy="190" r="20" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="140" y="195" text-anchor="middle" font-size="14" fill="#222222">B</text>
<text x="140" y="228" text-anchor="middle" font-size="12" fill="#C0392B">degree 3, odd</text>
<circle cx="520" cy="190" r="20" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="520" y="195" text-anchor="middle" font-size="14" fill="#222222">C</text>
<text x="520" y="228" text-anchor="middle" font-size="12" fill="#C0392B">degree 3, odd</text>
<circle cx="330" cy="300" r="20" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="330" y="305" text-anchor="middle" font-size="14" fill="#222222">D</text>
<text x="330" y="338" text-anchor="middle" font-size="12" fill="#C0392B">degree 3, odd</text>
<text x="20" y="360.0" font-size="13" fill="#666666">All four degrees are odd. One odd vertex already rules out an Euler circuit, and here there are</text>
<text x="20" y="380.0" font-size="13" fill="#666666">four.</text>
<text x="20" y="404.0" font-size="13" fill="#C0392B">So no route crosses every bridge exactly once and returns home.</text>
</svg>