<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="430" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 4.1. A cycle alternates sides, so it can only close after an even number of steps.</text>
<line x1="330.0" y1="90.0" x2="444.3153532995459" y2="140.0" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="444.3153532995459" y1="140.0" x2="444.3153532995459" y2="240.0" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="444.3153532995459" y1="240.0" x2="330.0" y2="290.0" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="330.0" y1="290.0" x2="215.68464670045412" y2="240.00000000000003" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="215.68464670045412" y1="240.00000000000003" x2="215.6846467004541" y2="140.0" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<line x1="215.6846467004541" y1="140.0" x2="330.0" y2="90.0" stroke="#333333" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="330.0" cy="90.0" r="8" fill="#185FA5"/>
<text x="330.0" y="66.0" font-size="12" fill="#185FA5" text-anchor="middle">step 0</text>
<circle cx="444.3153532995459" cy="140.0" r="8" fill="#C0392B"/>
<text x="490.3153532995459" y="134.0" font-size="12" fill="#C0392B" text-anchor="middle">step 1</text>
<circle cx="444.3153532995459" cy="240.0" r="8" fill="#185FA5"/>
<text x="490.3153532995459" y="256.0" font-size="12" fill="#185FA5" text-anchor="middle">step 2</text>
<circle cx="330.0" cy="290.0" r="8" fill="#C0392B"/>
<text x="330.0" y="322.0" font-size="12" fill="#C0392B" text-anchor="middle">step 3</text>
<circle cx="215.68464670045412" cy="240.00000000000003" r="8" fill="#185FA5"/>
<text x="169.68464670045412" y="256.0" font-size="12" fill="#185FA5" text-anchor="middle">step 4</text>
<circle cx="215.6846467004541" cy="140.0" r="8" fill="#C0392B"/>
<text x="169.6846467004541" y="134.0" font-size="12" fill="#C0392B" text-anchor="middle">step 5</text>
<text x="330" y="182" font-size="13" fill="#185FA5" text-anchor="middle">side A in blue</text>
<text x="330" y="206" font-size="13" fill="#C0392B" text-anchor="middle">side B in red</text>
<text x="330" y="316" font-size="13" fill="#333333" text-anchor="middle">A  B  A  B  A  B  and step 6 lands back on A</text>
<text x="330" y="348.0" font-size="12" fill="#666666" text-anchor="middle">Every edge crosses between the sides, so the side flips at every single step. Starting on A, after an odd</text>
<text x="330" y="368.0" font-size="12" fill="#666666" text-anchor="middle">number of steps you are on B and after an even number you are back on A. Closing</text>
<text x="330" y="388" font-size="12" fill="#666666" text-anchor="middle">the cycle means returning to the start, so its length is even.</text>
</svg>
