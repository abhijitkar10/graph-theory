<text x="385" y="198" font-size="14" fill="#185FA5" text-anchor="middle">s₄</text>
<text x="509" y="216" font-size="15" fill="#B8860B" text-anchor="start">s₅</text>
<text x="165" y="364" font-size="12" fill="#666666" text-anchor="middle">The blue vertices cut the cycle into four</text>
<text x="165" y="384" font-size="12" fill="#666666" text-anchor="middle">arcs. The two red paths end in the same arc,</text>
<text x="165" y="404" font-size="12" fill="#666666" text-anchor="middle">between s₃ and s₄.</text>
<text x="495" y="364" font-size="12" fill="#666666" text-anchor="middle">Drop the stretch between the red ends, which</text>
<text x="495" y="384" font-size="12" fill="#666666" text-anchor="middle">holds no blue vertex, and go out and back</text>
<text x="495" y="404" font-size="12" fill="#666666" text-anchor="middle">through s₅ instead.</text>
<text x="330" y="430" font-size="12" fill="#666666" text-anchor="middle">Every blue vertex is still on the new cycle, and so is s₅. That is the step from k − 1 chosen</text>
<text x="330" y="450" font-size="12" fill="#666666" text-anchor="middle">vertices to k.</text>
