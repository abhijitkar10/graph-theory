<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 391" width="660" height="391" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="391" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 9.2. The same count applied to the whole graph makes the two sides equal.</text>
<ellipse cx="180" cy="180" rx="58" ry="104" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<text x="180" y="60" font-size="14" fill="#185FA5" text-anchor="middle">A</text>
<ellipse cx="480" cy="180" rx="58" ry="104" fill="none" stroke="#3B6D11" stroke-width="2.4"/>
<text x="480" y="60" font-size="14" fill="#3B6D11" text-anchor="middle">B</text>
<line x1="238" y1="132.0" x2="422" y2="132.0" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="238" y1="164.0" x2="422" y2="164.0" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="238" y1="196.0" x2="422" y2="196.0" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<line x1="238" y1="228.0" x2="422" y2="228.0" stroke="#c4c4c4" stroke-width="1.8" stroke-linecap="round"/>
<text x="330" y="138" font-size="11" fill="#666666" text-anchor="middle">every edge has exactly one end on each side</text>
<text x="180" y="306" font-size="13" fill="#185FA5" text-anchor="middle">counted from A: k∣A∣</text>
<text x="480" y="306" font-size="13" fill="#3B6D11" text-anchor="middle">counted from B: k∣B∣</text>
<text x="330" y="336" font-size="13" fill="#333333" text-anchor="middle">same edges, so k∣A∣ = ∣E(G)∣ = k∣B∣</text>
<text x="330" y="360.0" font-size="12" fill="#666666" text-anchor="middle">Divide by k, which is at least 1, and ∣A∣ = ∣B∣. So a matching saturating A automatically covers B too,</text>
<text x="330" y="380.0" font-size="12" fill="#666666" text-anchor="middle">making it perfect.</text>
</svg>
