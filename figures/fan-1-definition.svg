<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="360" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">A fan of size 3 from x to U: paths meeting only at x, ending at different vertices of U.</text>
<ellipse cx="330" cy="185" rx="34" ry="128" fill="#e4eef9" stroke="#185FA5" stroke-width="2.2" fill-opacity="0.6"/>
<text x="330" y="38" font-size="16" fill="#185FA5" text-anchor="middle">U</text>
<line x1="60" y1="170" x2="180" y2="80" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="60" y1="170" x2="180" y2="150" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="60" y1="170" x2="180" y2="220" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="60" y1="170" x2="180" y2="290" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="80" x2="330" y2="80" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="150" x2="330" y2="150" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="220" x2="330" y2="220" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="290" x2="330" y2="290" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="80" x2="330" y2="150" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="150" x2="180" y2="220" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="220" x2="330" y2="290" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="60" y1="170" x2="180" y2="80" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<line x1="180" y1="80" x2="330" y2="80" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<line x1="60" y1="170" x2="180" y2="150" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="180" y1="150" x2="330" y2="150" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="60" y1="170" x2="180" y2="290" stroke="#B8860B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="180" y1="290" x2="330" y2="290" stroke="#B8860B" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="60" cy="170" r="6" fill="#333333"/>
<circle cx="180" cy="80" r="6" fill="#333333"/>
<circle cx="180" cy="150" r="6" fill="#333333"/>
<circle cx="180" cy="220" r="6" fill="#333333"/>
<circle cx="180" cy="290" r="6" fill="#333333"/>
<circle cx="330" cy="80" r="6" fill="#333333"/>
<circle cx="330" cy="150" r="6" fill="#333333"/>
<circle cx="330" cy="220" r="6" fill="#333333"/>
<circle cx="330" cy="290" r="6" fill="#333333"/>
<text x="60" y="154" font-size="15" fill="#333333" text-anchor="middle">x</text>
<text x="334" y="68" font-size="13" fill="#185FA5" text-anchor="start">u₁</text>
<text x="334" y="138" font-size="13" fill="#185FA5" text-anchor="start">u₂</text>
<text x="334" y="208" font-size="13" fill="#185FA5" text-anchor="start">u₃</text>
<text x="334" y="278" font-size="13" fill="#185FA5" text-anchor="start">u₄</text>
<text x="330" y="326" font-size="12" fill="#666666" text-anchor="middle">|U| = 4 here, and the fan uses three of its vertices. The paths x m₁ u₁, x m₂ u₂ and x m₄ u₄</text>
<text x="330" y="346" font-size="12" fill="#666666" text-anchor="middle">share only x, and no path passes through another vertex of U before it ends.</text>
<text x="182" y="69" font-size="13" fill="#666666" text-anchor="middle">m₁</text>
<text x="182" y="139" font-size="13" fill="#666666" text-anchor="middle">m₂</text>
<text x="182" y="209" font-size="13" fill="#666666" text-anchor="middle">m₃</text>
<text x="182" y="279" font-size="13" fill="#666666" text-anchor="middle">m₄</text>
</svg>
