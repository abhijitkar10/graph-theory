<text x="20" y="286" text-anchor="start" font-size="13" fill="#666666">Every maximum matching in C5 has two edges and leaves exactly one vertex out.</text>
<text x="20" y="310" text-anchor="start" font-size="13" fill="#C0392B">The cycle looks the same from every vertex, so each one is the leftover in some matching.</text>
<text x="20" y="334" text-anchor="start" font-size="13" fill="#666666">So there is no vertex common to all of them. Odd cycles are the obstruction the theorem has to rule out.</text>
