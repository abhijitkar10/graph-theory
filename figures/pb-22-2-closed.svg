<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 414" width="660" height="414" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="414" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 22.2. A closed ear has both ends at one vertex, so one deletion strands it.</text>
<line x1="330.0" y1="68.0" x2="407.9866343362026" y2="124.66060646125432" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="407.9866343362026" y1="124.66060646125432" x2="378.1983906879828" y2="216.3393935387457" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="378.1983906879828" y1="216.3393935387457" x2="281.8016093120172" y2="216.3393935387457" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="281.8016093120172" y1="216.3393935387457" x2="252.0133656637974" y2="124.66060646125432" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="252.0133656637974" y1="124.66060646125432" x2="330.0" y2="68.0" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
