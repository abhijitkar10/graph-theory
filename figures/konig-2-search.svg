<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 424" width="660" height="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="424" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The search: from the unmatched a₃, out on a non-matching edge, back on a matching one.</text>
<text x="180" y="58" font-size="15" fill="#666666" text-anchor="middle">A</text>
<text x="470" y="58" font-size="15" fill="#666666" text-anchor="middle">B</text>
<line x1="180" y1="85" x2="470" y2="105" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="165" x2="470" y2="105" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="165" x2="470" y2="205" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="245" x2="470" y2="205" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="325" x2="470" y2="325" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="245" x2="470" y2="205" stroke="#3B6D11" stroke-width="3.6" stroke-linecap="round"/>
<text x="330" y="238" font-size="15" fill="#3B6D11" text-anchor="middle">1</text>
<line x1="470" y1="205" x2="180" y2="165" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<text x="330" y="178" font-size="15" fill="#C0392B" text-anchor="middle">2</text>
<line x1="180" y1="165" x2="470" y2="105" stroke="#3B6D11" stroke-width="3.6" stroke-linecap="round"/>
<text x="330" y="126" font-size="15" fill="#3B6D11" text-anchor="middle">3</text>
<line x1="470" y1="105" x2="180" y2="85" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/>
<text x="330" y="86" font-size="15" fill="#C0392B" text-anchor="middle">4</text>
<circle cx="180" cy="85" r="6" fill="#333333"/>
<circle cx="180" cy="165" r="6" fill="#333333"/>
<circle cx="180" cy="245" r="6" fill="#333333"/>
<circle cx="180" cy="325" r="6" fill="#333333"/>
<circle cx="470" cy="105" r="6" fill="#333333"/>
<circle cx="470" cy="205" r="6" fill="#333333"/>
<circle cx="470" cy="325" r="6" fill="#333333"/>
<circle cx="180" cy="85" r="13" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<circle cx="180" cy="165" r="13" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<circle cx="180" cy="245" r="13" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<circle cx="470" cy="105" r="13" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<circle cx="470" cy="205" r="13" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<text x="154" y="90.0" font-size="14" fill="#333333" text-anchor="middle">a₁</text>
<text x="154" y="170.0" font-size="14" fill="#333333" text-anchor="middle">a₂</text>
<text x="154" y="250.0" font-size="14" fill="#333333" text-anchor="middle">a₃</text>
<text x="154" y="330.0" font-size="14" fill="#333333" text-anchor="middle">a₄</text>
<text x="496" y="190.0" font-size="14" fill="#333333" text-anchor="middle">b₁</text>
<text x="496" y="210.0" font-size="14" fill="#333333" text-anchor="middle">b₂</text>
<text x="496" y="330.0" font-size="14" fill="#333333" text-anchor="middle">b₃</text>
<text x="330" y="368.0" font-size="12" fill="#666666" text-anchor="middle">Green is an edge outside M, red is an edge inside M.</text>
<text x="330" y="390.0" font-size="12" fill="#185FA5" text-anchor="middle">Reached: Zₐ = {a₁, a₂, a₃} and Zᴮ = {b₁, b₂}. Never reached: a₄ and b₃.</text>
<text x="330" y="412.0" font-size="12" fill="#666666" text-anchor="middle">a₁ halts the search, since its only edge a₁b₁ is already a matching edge.</text>
</svg>
