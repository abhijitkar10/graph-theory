<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="360" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 7.1. The edges of M are disjoint, so no single vertex can cover two of them.</text>
<line x1="150" y1="120" x2="150" y2="240" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<line x1="330" y1="120" x2="330" y2="240" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<line x1="510" y1="120" x2="510" y2="240" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<circle cx="150" cy="120" r="6" fill="#333333"/>
<circle cx="150" cy="240" r="6" fill="#333333"/>
<circle cx="330" cy="120" r="6" fill="#333333"/>
<circle cx="330" cy="240" r="6" fill="#333333"/>
<circle cx="510" cy="120" r="6" fill="#333333"/>
<circle cx="510" cy="240" r="6" fill="#333333"/>
<circle cx="150" cy="120" r="13" fill="none" stroke="#185FA5" stroke-width="2.8"/>
<circle cx="330" cy="120" r="13" fill="none" stroke="#185FA5" stroke-width="2.8"/>
<text x="330" y="94" font-size="11" fill="#185FA5" text-anchor="middle">cover picks one end of edge 2</text>
<circle cx="510" cy="120" r="13" fill="none" stroke="#185FA5" stroke-width="2.8"/>
<text x="330" y="286" font-size="12" fill="#185FA5" text-anchor="middle">three disjoint edges, so the three picked vertices are three different vertices</text>
<text x="330" y="314.0" font-size="12" fill="#666666" text-anchor="middle">A cover must meet every edge of M. The edges share no vertex, so the vertices it picks for them are all</text>
<text x="330" y="334.0" font-size="12" fill="#666666" text-anchor="middle">distinct. That is ∣M∣ distinct vertices inside any cover, so β ≥ α′.</text>
</svg>
