<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="400" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 17.2. Both sets live in the same box of 6 positions, and 4 + 4 will not fit.</text>
<text x="330" y="62" font-size="12" fill="#666666" text-anchor="middle">the box of positions {1, …, k}, here k = 6</text>
<rect x="110" y="180" width="72" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="146.0" y="213" font-size="15" fill="#333333" text-anchor="middle">1</text>
<rect x="182" y="180" width="72" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="218.0" y="213" font-size="15" fill="#333333" text-anchor="middle">2</text>
<rect x="254" y="180" width="72" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="290.0" y="213" font-size="15" fill="#333333" text-anchor="middle">3</text>
<rect x="326" y="180" width="72" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="362.0" y="213" font-size="15" fill="#333333" text-anchor="middle">4</text>
<rect x="398" y="180" width="72" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="434.0" y="213" font-size="15" fill="#333333" text-anchor="middle">5</text>
<rect x="470" y="180" width="72" height="52" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="506.0" y="213" font-size="15" fill="#333333" text-anchor="middle">6</text>
<circle cx="146.0" cy="154" r="7" fill="#3B6D11"/>
<circle cx="290.0" cy="154" r="7" fill="#3B6D11"/>
<circle cx="362.0" cy="154" r="7" fill="#3B6D11"/>
<circle cx="434.0" cy="154" r="7" fill="#3B6D11"/>
<circle cx="218.0" cy="258" r="7" fill="#185FA5"/>
<circle cx="290.0" cy="258" r="7" fill="#185FA5"/>
<circle cx="434.0" cy="258" r="7" fill="#185FA5"/>
<circle cx="506.0" cy="258" r="7" fill="#185FA5"/>
<text x="72" y="159" font-size="15" fill="#3B6D11" text-anchor="middle">A</text>
<text x="72" y="263" font-size="15" fill="#185FA5" text-anchor="middle">B</text>
<text x="330" y="132" font-size="13" fill="#3B6D11" text-anchor="middle">A = {1, 3, 4, 5}, so ∣A∣ = 4</text>
<text x="330" y="278" font-size="13" fill="#185FA5" text-anchor="middle">B = {2, 3, 5, 6}, so ∣B∣ = 4</text>
<rect x="254" y="180" width="72" height="52" fill="none" stroke="#C0392B" stroke-width="3"/>
<rect x="398" y="180" width="72" height="52" fill="none" stroke="#C0392B" stroke-width="3"/>
<text x="330" y="322" font-size="12" fill="#C0392B" text-anchor="middle">∣A∣ + ∣B∣ = 8 markers crammed into 6 boxes, so some box gets two. Here 3 and 5 do.</text>
<text x="330" y="350" font-size="12" fill="#666666" text-anchor="middle">In the theorem ∣A∣ and ∣B∣ are each at least n/2, so they add to at least n, and k ≤ n−1.</text>
<text x="330" y="372" font-size="12" fill="#666666" text-anchor="middle">Take any i in the overlap. Below, i = 3.</text>
</svg>
