<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 331" width="660" height="331" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="331" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The two crossing edges close P into a cycle through all seven of its vertices.</text>
<path d="M 60 150 Q 272 -90 485 150" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<path d="M 570 150 Q 485 220 400 150" fill="none" stroke="#185FA5" stroke-width="2.5"/>
<line x1="60" y1="150" x2="570" y2="150" stroke="#333333" stroke-width="2"/>
<circle cx="60" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="145" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="230" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="315" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="400" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="485" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<circle cx="570" cy="150" r="7" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="60" y="180" text-anchor="middle" font-size="13" fill="#888888">v0</text>
<text x="145" y="180" text-anchor="middle" font-size="13" fill="#888888">v1</text>
<text x="230" y="180" text-anchor="middle" font-size="13" fill="#888888">v2</text>
<text x="315" y="180" text-anchor="middle" font-size="13" fill="#888888">v3</text>
<text x="400" y="180" text-anchor="middle" font-size="13" fill="#888888">v4</text>
<text x="485" y="180" text-anchor="middle" font-size="13" fill="#888888">v5</text>
<text x="570" y="180" text-anchor="middle" font-size="13" fill="#888888">v6</text>
<text x="272" y="46" text-anchor="middle" font-size="12" fill="#C0392B">v0 to v5</text>
<text x="485" y="236" text-anchor="middle" font-size="12" fill="#185FA5">v6 to v4</text>
<text x="20" y="272" font-size="13" fill="#3B6D11">Walk v0, v1, v2, v3, v4, then jump to v6, back to v5, then jump home to v0.</text>
<text x="20" y="298" font-size="13" fill="#3B6D11">Every one of the seven vertices is used exactly once, so this is a cycle.</text>
<text x="20" y="320" font-size="13" fill="#666666">If v6 had joined v5 instead of v4, there would be no crossing and the walk would not close.</text>
</svg>