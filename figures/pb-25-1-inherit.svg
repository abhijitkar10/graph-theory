<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 304" width="660" height="304" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="304" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 25.1. Having no even cycle is inherited by every subgraph, which is what lets you strip.</text>
<ellipse cx="190" cy="170" rx="104" ry="74" fill="none" stroke="#333333" stroke-width="2.6"/>
<text x="190" y="174" font-size="13" fill="#333333" text-anchor="middle">G, no even cycle</text>
<text x="330" y="170" font-size="24" fill="#666666" text-anchor="middle">→</text>
<ellipse cx="480" cy="170" rx="80" ry="60" fill="none" stroke="#3B6D11" stroke-width="2.6"/>
<text x="480" y="174.0" font-size="12" fill="#3B6D11" text-anchor="middle">any subgraph</text>
<text x="480" y="194.0" font-size="12" fill="#3B6D11" text-anchor="middle">still no even cycle</text>
<text x="330" y="232.0" font-size="12" fill="#666666" text-anchor="middle">A subgraph has only the vertices and edges you kept, so any cycle inside it was already a</text>
<text x="330" y="252.0" font-size="12" fill="#666666" text-anchor="middle">cycle of G. Deleting things can never create a cycle. So the hypothesis survives every</text>
<text x="330" y="272.0" font-size="12" fill="#666666" text-anchor="middle">deletion, and the stripping argument is allowed to keep using it.</text>
</svg>
