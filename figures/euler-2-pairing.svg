<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="400" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Why every degree must be even. Each visit to a vertex uses exactly two edges.</text>
<line x1="170" y1="90" x2="170" y2="230" stroke="#bbbbbb" stroke-width="2"/>
<line x1="170" y1="90" x2="330" y2="160" stroke="#bbbbbb" stroke-width="2"/>
<line x1="170" y1="230" x2="330" y2="160" stroke="#bbbbbb" stroke-width="2"/>
<line x1="330" y1="160" x2="490" y2="90" stroke="#bbbbbb" stroke-width="2"/>
<line x1="330" y1="160" x2="490" y2="230" stroke="#bbbbbb" stroke-width="2"/>
<line x1="490" y1="90" x2="490" y2="230" stroke="#bbbbbb" stroke-width="2"/>
<line x1="170" y1="230" x2="330" y2="160" stroke="#C0392B" stroke-width="3.5"/>
<line x1="330" y1="160" x2="490" y2="90" stroke="#C0392B" stroke-width="3.5"/>
<line x1="490" y1="230" x2="330" y2="160" stroke="#185FA5" stroke-width="3.5"/>
<line x1="330" y1="160" x2="170" y2="90" stroke="#185FA5" stroke-width="3.5"/>
<circle cx="170" cy="90" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="170" y="95" text-anchor="middle" font-size="14" fill="#222222">a</text>
<circle cx="170" cy="230" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="170" y="235" text-anchor="middle" font-size="14" fill="#222222">b</text>
<circle cx="330" cy="160" r="19" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="330" y="165" text-anchor="middle" font-size="14" fill="#222222">c</text>
<circle cx="490" cy="90" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="490" y="95" text-anchor="middle" font-size="14" fill="#222222">d</text>
<circle cx="490" cy="230" r="17" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="490" y="235" text-anchor="middle" font-size="14" fill="#222222">e</text>
<text x="250" y="212" text-anchor="middle" font-size="12" fill="#C0392B">first visit: in by bc, out by cd</text>
<text x="410" y="118" text-anchor="middle" font-size="12" fill="#185FA5">second visit: in by ec, out by ca</text>
<text x="20" y="300.0" font-size="13" fill="#666666">The circuit passes through c twice, so it consumes 2 + 2 = 4 edges there. That accounts for all</text>
<text x="20" y="320.0" font-size="13" fill="#666666">of them.</text>
<text x="20" y="344.0" font-size="13" fill="#666666">Pass through any vertex t times and you use 2t edges. An Euler circuit uses every edge, so</text>
<text x="20" y="364.0" font-size="13" fill="#666666">every degree is even.</text>
<text x="20" y="388.0" font-size="13" fill="#666666">At the starting vertex, pair the very first edge with the very last. Even again.</text>
</svg>