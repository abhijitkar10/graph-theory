<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="340" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Both endpoints of a maximum matching always form a vertex cover.</text>
<line x1="90" y1="110" x2="210" y2="110" stroke="#3B6D11" stroke-width="4"/>
<line x1="90" y1="210" x2="210" y2="210" stroke="#3B6D11" stroke-width="4"/>
<line x1="330" y1="160" x2="450" y2="160" stroke="#3B6D11" stroke-width="4"/>
<line x1="210" y1="110" x2="330" y2="160" stroke="#bbbbbb" stroke-width="2"/>
<line x1="210" y1="210" x2="330" y2="160" stroke="#bbbbbb" stroke-width="2"/>
<line x1="450" y1="160" x2="560" y2="110" stroke="#bbbbbb" stroke-width="2"/>
<circle cx="90" cy="110" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="90" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="210" cy="110" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="210" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="90" cy="210" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="90" y="214" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="210" cy="210" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="210" y="214" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="330" cy="160" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="330" y="164" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="450" cy="160" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="450" y="164" text-anchor="middle" font-size="12" fill="#222222"></text>
<circle cx="560" cy="110" r="11" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="560" y="114" text-anchor="middle" font-size="12" fill="#222222"></text>
<text x="20" y="262" text-anchor="start" font-size="13" fill="#666666">Green vertices are the endpoints of a maximum matching, so there are twice as many of them as matching edges.</text>
<text x="20" y="286" text-anchor="start" font-size="13" fill="#666666">Any edge with neither end green could be added to the matching, contradicting that it was maximum.</text>
<text x="20" y="310" text-anchor="start" font-size="13" fill="#3B6D11">So the green set covers everything, giving a cover of size twice the matching number.</text>
<text x="20" y="334" text-anchor="start" font-size="13" fill="#666666">Combined with the easy direction, the cover number sits between the matching number and twice it.</text>
</svg>