<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="470" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Claim 20.1. Subdividing cd with w, and the three ways a vertex can be deleted.</text>
<line x1="330" y1="86" x2="474" y2="182" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="474" y1="182" x2="418" y2="332" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="242" y1="332" x2="186" y2="182" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="186" y1="182" x2="330" y2="86" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="474" y1="182" x2="186" y2="182" stroke="#333333" stroke-width="2.6" stroke-linecap="round"/>
<line x1="418" y1="332" x2="330" y2="332" stroke="#185FA5" stroke-width="2.8" stroke-linecap="round"/>
<line x1="330" y1="332" x2="242" y2="332" stroke="#185FA5" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="330" cy="86" r="6" fill="#333333"/>
<circle cx="474" cy="182" r="6" fill="#333333"/>
<circle cx="418" cy="332" r="6" fill="#333333"/>
<circle cx="242" cy="332" r="6" fill="#333333"/>
<circle cx="186" cy="182" r="6" fill="#333333"/>
<circle cx="330" cy="332" r="7" fill="#185FA5"/>
<text x="330" y="68" font-size="14" fill="#333333" text-anchor="middle">a</text>
<text x="494" y="187" font-size="14" fill="#333333" text-anchor="middle">b</text>
<text x="436" y="348" font-size="14" fill="#333333" text-anchor="middle">c</text>
<text x="224" y="348" font-size="14" fill="#333333" text-anchor="middle">d</text>
<text x="166" y="187" font-size="14" fill="#333333" text-anchor="middle">e</text>
<text x="330" y="356" font-size="14" fill="#185FA5" text-anchor="middle">w</text>
<text x="330" y="392" font-size="12" fill="#666666" text-anchor="middle">Delete w and you are back to G with the edge cd gone, which is connected since G has no bridge.</text>
<text x="330" y="412" font-size="12" fill="#666666" text-anchor="middle">Delete c and w keeps only wd, so it hangs as a pendant off d, and G − c was already connected.</text>
<text x="330" y="432.0" font-size="12" fill="#666666" text-anchor="middle">Delete anything else and nothing about the subdivision changed. Reading it the other way, suppressing</text>
<text x="330" y="452.0" font-size="12" fill="#666666" text-anchor="middle">w turns H − u back into G − u without breaking anything.</text>
</svg>
