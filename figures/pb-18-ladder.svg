<circle cx="470" cy="122" r="5" fill="#333333"/>
<circle cx="524" cy="76" r="5" fill="#333333"/>
<circle cx="570" cy="134" r="5" fill="#333333"/>
<circle cx="524" cy="190" r="5" fill="#333333"/>
<circle cx="616" cy="100" r="5" fill="#333333"/>
<circle cx="616" cy="190" r="5" fill="#333333"/>
<text x="454" y="150.0" font-size="12" fill="#333333" text-anchor="middle">x</text>
<text x="524" y="62" font-size="12" fill="#333333" text-anchor="middle">v₁</text>
<text x="578" y="178.0" font-size="12" fill="#333333" text-anchor="middle">v₂</text>
<text x="510" y="220.0" font-size="12" fill="#333333" text-anchor="middle">a</text>
<text x="616" y="86" font-size="12" fill="#333333" text-anchor="middle">y</text>
<text x="616" y="234.0" font-size="12" fill="#333333" text-anchor="middle">c</text>
<circle cx="470" cy="122" r="12" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<circle cx="616" cy="100" r="12" fill="none" stroke="#185FA5" stroke-width="2.4"/>
<text x="541" y="46" font-size="13" fill="#185FA5" text-anchor="middle">x to y, distance 3</text>
<text x="541" y="142.0" font-size="12" fill="#185FA5" text-anchor="middle">step, case two</text>
<text x="214" y="156.0" font-size="22" fill="#666666" text-anchor="middle">→</text>
<text x="428" y="156.0" font-size="22" fill="#666666" text-anchor="middle">→</text>
<text x="330" y="186.0" font-size="12" fill="#666666" text-anchor="middle">Rung 1. x and a are adjacent, so one path is the edge itself and the other comes from G minus that edge.</text>
<text x="330" y="207.0" font-size="12" fill="#666666" text-anchor="middle">Rung 2. For x and v₂ take v = v₁, at distance 1, so rung 1 applies. Here v₂ already lies on the two paths</text>
<text x="330" y="228.0" font-size="12" fill="#666666" text-anchor="middle">it returns, so the cycle they form hands you the answer. That is case one.</text>
<text x="330" y="249.0" font-size="12" fill="#666666" text-anchor="middle">Rung 3. For x and y take v = v₂, at distance 2, so rung 2 applies. This time y is on neither path, so you</text>
<text x="330" y="270.0" font-size="12" fill="#666666" text-anchor="middle">walk back from y and stop at the first vertex already used, namely a. That is case two.</text>
<text x="330" y="306.0" font-size="12" fill="#333333" text-anchor="middle">The induction is on distance, not on the number of vertices. Each rung uses only the one below it.</text>
<text x="330" y="334.0" font-size="12" fill="#666666" text-anchor="middle">v is always the vertex just before the target on a shortest path, because that is the only choice</text>
<text x="330" y="354.0" font-size="12" fill="#666666" text-anchor="middle">that drops the distance by exactly one, which is what lets you reach the previous rung.</text>
</svg>
