<line x1="524" y1="76" x2="570" y2="134" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/>
<line x1="570" y1="134" x2="616" y2="100" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/>
<line x1="470" y1="122" x2="524" y2="190" stroke="#3B6D11" stroke-width="3.2" stroke-linecap="round"/>
<line x1="524" y1="190" x2="616" y2="190" stroke="#3B6D11" stroke-width="3.2" stroke-linecap="round"/>
