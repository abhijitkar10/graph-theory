<text x="310" y="62" font-size="12" fill="#333333" text-anchor="middle">v₁</text>
<text x="364" y="178.0" font-size="12" fill="#333333" text-anchor="middle">v₂</text>
<text x="296" y="220.0" font-size="12" fill="#333333" text-anchor="middle">a</text>
<text x="402" y="86" font-size="12" fill="#333333" text-anchor="middle">y</text>
<text x="402" y="234.0" font-size="12" fill="#333333" text-anchor="middle">c</text>
