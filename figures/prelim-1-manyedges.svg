<text x="230" y="290" text-anchor="middle" font-size="13" fill="#666666">K5, ten edges</text>
<text x="520" y="290" text-anchor="middle" font-size="13" fill="#C0392B">one lonely vertex</text>
<text x="20" y="250.0" font-size="13" fill="#666666" text-anchor="start">Ten edges packed into five vertices, and one vertex with none. The graph is disconnected and</text>
<text x="20" y="270.0" font-size="13" fill="#666666" text-anchor="start">the minimum degree is 0.</text>
<text x="20" y="294.0" font-size="13" fill="#666666" text-anchor="start">Many edges is a statement about the graph as a whole. It says nothing about any single vertex.</text>
