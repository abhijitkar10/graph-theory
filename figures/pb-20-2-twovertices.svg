<text x="20" y="24" font-size="13" fill="#666666">Claim 20.2. Two internally disjoint paths with the same ends glue into a cycle.</text>
<line x1="330" y1="86" x2="474" y2="182" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round"/>
<line x1="474" y1="182" x2="418" y2="332" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round"/>
<line x1="418" y1="332" x2="242" y2="332" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round"/>
<line x1="242" y1="332" x2="186" y2="182" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round"/>
<line x1="186" y1="182" x2="330" y2="86" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round"/>
<line x1="474" y1="182" x2="186" y2="182" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round"/>
<line x1="330" y1="86" x2="474" y2="182" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="474" y1="182" x2="418" y2="332" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="330" y1="86" x2="186" y2="182" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<line x1="186" y1="182" x2="242" y2="332" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<line x1="242" y1="332" x2="418" y2="332" stroke="#3B6D11" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="330" cy="86" r="6" fill="#333333"/>
<circle cx="474" cy="182" r="6" fill="#333333"/>
<circle cx="418" cy="332" r="6" fill="#333333"/>
<circle cx="242" cy="332" r="6" fill="#333333"/>
<circle cx="186" cy="182" r="6" fill="#333333"/>
<text x="330" y="68" font-size="14" fill="#333333" text-anchor="middle">a</text>
<text x="494" y="187" font-size="14" fill="#333333" text-anchor="middle">b</text>
<text x="436" y="348" font-size="14" fill="#333333" text-anchor="middle">c</text>
<text x="224" y="348" font-size="14" fill="#333333" text-anchor="middle">d</text>
<text x="166" y="187" font-size="14" fill="#333333" text-anchor="middle">e</text>
<circle cx="330" cy="86" r="14" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<circle cx="418" cy="332" r="14" fill="none" stroke="#185FA5" stroke-width="2.6"/>
<text x="452" y="122" font-size="13" fill="#C0392B" text-anchor="middle">a b c</text>
<text x="176" y="272" font-size="13" fill="#3B6D11" text-anchor="middle">a e d c</text>
<text x="330" y="392.0" font-size="12" fill="#666666" text-anchor="middle">Whitney hands you the two paths. Laid end to end they close up into the cycle a b c d e a, which passes</text>
<text x="330" y="412.0" font-size="12" fill="#666666" text-anchor="middle">through both a and c. That is all Claim 20.2 says.</text>
