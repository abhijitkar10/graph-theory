<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 433" width="660" height="433" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="433" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">The cover: every B vertex you reached, plus every A vertex you did not</text>
<text x="180" y="58" font-size="15" fill="#666666" text-anchor="middle">A</text>
<text x="470" y="58" font-size="15" fill="#666666" text-anchor="middle">B</text>
<line x1="180" y1="165" x2="470" y2="105" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="245" x2="470" y2="205" stroke="#bbbbbb" stroke-width="1.8" stroke-linecap="round"/>
<line x1="180" y1="85" x2="470" y2="105" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<line x1="180" y1="165" x2="470" y2="205" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<line x1="180" y1="325" x2="470" y2="325" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
<circle cx="180" cy="85" r="6" fill="#333333"/>
<circle cx="180" cy="165" r="6" fill="#333333"/>
<circle cx="180" cy="245" r="6" fill="#333333"/>
<circle cx="180" cy="325" r="6" fill="#333333"/>
<circle cx="470" cy="105" r="6" fill="#333333"/>
<circle cx="470" cy="205" r="6" fill="#333333"/>
<circle cx="470" cy="325" r="6" fill="#333333"/>
<circle cx="470" cy="105" r="14" fill="none" stroke="#185FA5" stroke-width="3"/>
<circle cx="470" cy="205" r="14" fill="none" stroke="#185FA5" stroke-width="3"/>
<circle cx="180" cy="325" r="14" fill="none" stroke="#185FA5" stroke-width="3"/>
<text x="154" y="90.0" font-size="14" fill="#333333" text-anchor="middle">a₁</text>
<text x="154" y="170.0" font-size="14" fill="#333333" text-anchor="middle">a₂</text>
<text x="154" y="250.0" font-size="14" fill="#333333" text-anchor="middle">a₃</text>
<text x="154" y="330.0" font-size="14" fill="#333333" text-anchor="middle">a₄</text>
<text x="496" y="190.0" font-size="14" fill="#333333" text-anchor="middle">b₁</text>
<text x="496" y="210.0" font-size="14" fill="#333333" text-anchor="middle">b₂</text>
<text x="496" y="330.0" font-size="14" fill="#333333" text-anchor="middle">b₃</text>
<text x="522" y="190.0" font-size="12" fill="#185FA5" text-anchor="start">reached</text>
<text x="522" y="210.0" font-size="12" fill="#185FA5" text-anchor="start">reached</text>
<text x="126" y="330.0" font-size="12" fill="#185FA5" text-anchor="end">not reached</text>
<text x="330" y="378.0" font-size="14" fill="#185FA5" text-anchor="middle">C = {a₄, b₁, b₂}, so ∣C∣ = 3 = ∣M∣</text>
<text x="330" y="400.0" font-size="12" fill="#666666" text-anchor="middle">Each matching edge hands C exactly one end: b₁ from a₁b₁, b₂ from a₂b₂, a₄ from a₄b₃.</text>
<text x="330" y="422.0" font-size="12" fill="#666666" text-anchor="middle">Every edge is covered: a₁b₁ and a₂b₁ by b₁, a₂b₂ and a₃b₂ by b₂, a₄b₃ by a₄.</text>
</svg>
