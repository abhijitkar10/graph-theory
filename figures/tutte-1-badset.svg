<ellipse cx="330" cy="250" rx="52" ry="26" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="330" y="255" text-anchor="middle" font-size="14" fill="#3B6D11">S</text>
<text x="20" y="314.0" font-size="13" fill="#666666" text-anchor="start">Each triangle has three vertices, an odd number, so a matching inside it always leaves one</text>
<text x="20" y="334.0" font-size="13" fill="#666666" text-anchor="start">vertex over.</text>
<text x="20" y="358.0" font-size="13" fill="#C0392B" text-anchor="start">That leftover must pair with something in S. With four triangles and a smaller S, somebody is</text>
<text x="20" y="378.0" font-size="13" fill="#C0392B" text-anchor="start">stranded.</text>
<text x="20" y="398.0" font-size="13" fill="#3B6D11" text-anchor="start">Hall counts neighbours and sees nothing wrong here. What matters is the parity of the leftover</text>
<text x="20" y="418.0" font-size="13" fill="#3B6D11" text-anchor="start">pieces.</text>
