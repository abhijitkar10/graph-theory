<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370" width="660" height="370" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="370" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Removal order and reverse greedy colouring of the same graph. Degeneracy 3, χ = 4.</text>
<text x="160" y="60" font-size="13" fill="#666666" text-anchor="middle">Delete a vertex of least degree each time</text>
<line x1="60" y1="190" x2="160" y2="100" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="190" x2="160" y2="220" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="190" x2="60" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="100" x2="160" y2="220" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="100" x2="60" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="220" x2="60" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="100" x2="250" y2="160" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="220" x2="250" y2="160" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="250" y1="160" x2="320" y2="100" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="250" y1="160" x2="320" y2="220" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="60" cy="190" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="60" y="195" font-size="13" fill="#333333" text-anchor="middle">6</text>
<circle cx="160" cy="100" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="160" y="105" font-size="13" fill="#333333" text-anchor="middle">5</text>
<circle cx="160" cy="220" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="160" y="225" font-size="13" fill="#333333" text-anchor="middle">4</text>
<circle cx="60" cy="90" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="60" y="95" font-size="13" fill="#333333" text-anchor="middle">7</text>
<circle cx="250" cy="160" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="250" y="165" font-size="13" fill="#333333" text-anchor="middle">3</text>
<circle cx="320" cy="100" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="320" y="105" font-size="13" fill="#333333" text-anchor="middle">1</text>
<circle cx="320" cy="220" r="13" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="320" y="225" font-size="13" fill="#333333" text-anchor="middle">2</text>
<text x="500" y="60" font-size="13" fill="#666666" text-anchor="middle">Colour in the reverse order 7, 6, …, 1</text>
<line x1="380" y1="190" x2="480" y2="100" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="380" y1="190" x2="480" y2="220" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="380" y1="190" x2="380" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="100" x2="480" y2="220" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="100" x2="380" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="220" x2="380" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="100" x2="570" y2="160" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="220" x2="570" y2="160" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="570" y1="160" x2="640" y2="100" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="570" y1="160" x2="640" y2="220" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="380" cy="190" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="380" y="195" font-size="13" fill="#333333" text-anchor="middle">a</text>
<circle cx="480" cy="100" r="13" fill="#5B8DEF" stroke="#333333" stroke-width="2"/>
<text x="480" y="105" font-size="13" fill="#333333" text-anchor="middle">b</text>
<circle cx="480" cy="220" r="13" fill="#E07B7B" stroke="#333333" stroke-width="2"/>
<text x="480" y="225" font-size="13" fill="#333333" text-anchor="middle">c</text>
<circle cx="380" cy="90" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="380" y="95" font-size="13" fill="#333333" text-anchor="middle">d</text>
<circle cx="570" cy="160" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="570" y="165" font-size="13" fill="#333333" text-anchor="middle">e</text>
<circle cx="640" cy="100" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="640" y="105" font-size="13" fill="#333333" text-anchor="middle">f</text>
<circle cx="640" cy="220" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="640" y="225" font-size="13" fill="#333333" text-anchor="middle">g</text>
<text x="170" y="288" font-size="12" fill="#666666" text-anchor="middle">Left: the number on each vertex is its</text>
<text x="170" y="308" font-size="12" fill="#666666" text-anchor="middle">place in the deletion order.</text>
<text x="500" y="288" font-size="12" fill="#666666" text-anchor="middle">Right: when a vertex is coloured, at most</text>
<text x="500" y="308" font-size="12" fill="#666666" text-anchor="middle">3 of its neighbours already are, so one of</text>
<text x="500" y="328" font-size="12" fill="#666666" text-anchor="middle">4 colours is free.</text>
</svg>
