<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="400" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Splitting a tree by level does not give the largest independent set.</text>
<line x1="330" y1="80" x2="150" y2="175" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="80" x2="280" y2="175" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="80" x2="400" y2="175" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="80" x2="520" y2="175" stroke="#333333" stroke-width="2"/>
<line x1="150" y1="175" x2="100" y2="275" stroke="#333333" stroke-width="2"/>
<line x1="150" y1="175" x2="200" y2="275" stroke="#333333" stroke-width="2"/>
<circle cx="330" cy="80" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="330" y="85" text-anchor="middle" font-size="13" fill="#222222">r</text>
<circle cx="150" cy="175" r="17" fill="#EAF3DE" stroke="#185FA5" stroke-width="2"/>
<text x="150" y="180" text-anchor="middle" font-size="13" fill="#222222">a</text>
<circle cx="280" cy="175" r="17" fill="#EAF3DE" stroke="#185FA5" stroke-width="2"/>
<text x="280" y="180" text-anchor="middle" font-size="13" fill="#222222">b</text>
<circle cx="400" cy="175" r="17" fill="#EAF3DE" stroke="#185FA5" stroke-width="2"/>
<text x="400" y="180" text-anchor="middle" font-size="13" fill="#222222">c</text>
<circle cx="520" cy="175" r="17" fill="#EAF3DE" stroke="#185FA5" stroke-width="2"/>
<text x="520" y="180" text-anchor="middle" font-size="13" fill="#222222">d</text>
<circle cx="100" cy="275" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="100" y="280" text-anchor="middle" font-size="13" fill="#222222">e</text>
<circle cx="200" cy="275" r="16" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="200" y="280" text-anchor="middle" font-size="13" fill="#222222">f</text>
<text x="20" y="330" text-anchor="start" font-size="13" fill="#185FA5">Odd levels are a, b, c, d, which is 4 vertices. Even levels are r, e, f, which is 3.</text>
<text x="20" y="354" text-anchor="start" font-size="13" fill="#666666">The method picks the bigger of the two and answers 4.</text>
<text x="20" y="382" text-anchor="start" font-size="13" fill="#C0392B">But b, c, d, e, f is independent and has 5 vertices. The best answer mixes levels, so the method is wrong.</text>
</svg>