<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="340" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Induction step for χ ≤ Δ + 1: delete u = e, colour the rest, then give e a free colour.</text>
<text x="190" y="60" font-size="13" fill="#666666" text-anchor="middle">Colour G − e (five colours available)</text>
<line x1="60" y1="180" x2="160" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="180" x2="160" y2="210" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="180" x2="60" y2="80" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="90" x2="160" y2="210" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="90" x2="60" y2="80" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="160" y1="210" x2="60" y2="80" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="60" cy="180" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="60" y="185" font-size="13" fill="#333333" text-anchor="middle">a</text>
<circle cx="160" cy="90" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="160" y="95" font-size="13" fill="#333333" text-anchor="middle">b</text>
<circle cx="160" cy="210" r="13" fill="#5B8DEF" stroke="#333333" stroke-width="2"/>
<text x="160" y="215" font-size="13" fill="#333333" text-anchor="middle">c</text>
<circle cx="60" cy="80" r="13" fill="#E07B7B" stroke="#333333" stroke-width="2"/>
<text x="60" y="85" font-size="13" fill="#333333" text-anchor="middle">d</text>
<circle cx="320" cy="90" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="320" y="95" font-size="13" fill="#333333" text-anchor="middle">f</text>
<circle cx="320" cy="210" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="320" y="215" font-size="13" fill="#333333" text-anchor="middle">g</text>
<text x="500" y="60" font-size="13" fill="#666666" text-anchor="middle">Put e back</text>
<line x1="380" y1="180" x2="480" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="380" y1="180" x2="480" y2="210" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="380" y1="180" x2="380" y2="80" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="90" x2="480" y2="210" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="90" x2="380" y2="80" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="210" x2="380" y2="80" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="90" x2="570" y2="150" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="480" y1="210" x2="570" y2="150" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="570" y1="150" x2="640" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="570" y1="150" x2="640" y2="210" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="380" cy="180" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="380" y="185" font-size="13" fill="#333333" text-anchor="middle">a</text>
<circle cx="480" cy="90" r="13" fill="#4C9F70" stroke="#333333" stroke-width="2"/>
<text x="480" y="95" font-size="13" fill="#333333" text-anchor="middle">b</text>
<circle cx="480" cy="210" r="13" fill="#5B8DEF" stroke="#333333" stroke-width="2"/>
<text x="480" y="215" font-size="13" fill="#333333" text-anchor="middle">c</text>
<circle cx="380" cy="80" r="13" fill="#E07B7B" stroke="#333333" stroke-width="2"/>
<text x="380" y="85" font-size="13" fill="#333333" text-anchor="middle">d</text>
<circle cx="570" cy="150" r="13" fill="#E07B7B" stroke="#333333" stroke-width="2"/>
<text x="570" y="155" font-size="13" fill="#333333" text-anchor="middle">e</text>
<circle cx="640" cy="90" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="640" y="95" font-size="13" fill="#333333" text-anchor="middle">f</text>
<circle cx="640" cy="210" r="13" fill="#E8A33D" stroke="#333333" stroke-width="2"/>
<text x="640" y="215" font-size="13" fill="#333333" text-anchor="middle">g</text>
<text x="330" y="290" font-size="12" fill="#666666" text-anchor="middle">e has four neighbours b, c, f, g with colours 2, 3, 1, 1. At most four colours are blocked,</text>
<text x="330" y="310" font-size="12" fill="#666666" text-anchor="middle">so one of the five is free for e.</text>
</svg>
