<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="320" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Stripping low degree vertices. Each removal costs one vertex but few edges, so density rises.</text>
<line x1="70" y1="90" x2="140" y2="70" stroke="#333333" stroke-width="2"/>
<line x1="140" y1="70" x2="180" y2="130" stroke="#333333" stroke-width="2"/>
<line x1="180" y1="130" x2="120" y2="160" stroke="#333333" stroke-width="2"/>
<line x1="120" y1="160" x2="70" y2="90" stroke="#333333" stroke-width="2"/>
<line x1="70" y1="90" x2="180" y2="130" stroke="#333333" stroke-width="2"/>
<line x1="140" y1="70" x2="120" y2="160" stroke="#333333" stroke-width="2"/>
<line x1="120" y1="160" x2="150" y2="200" stroke="#333333" stroke-width="2"/>
<circle cx="70" cy="90" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="70" y="95" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="140" cy="70" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="140" y="75" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="180" cy="130" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="180" y="135" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="120" cy="160" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="120" y="165" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="150" cy="200" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="150" y="205" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="150" cy="200" r="10" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="150" y="205" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="120" y="240" text-anchor="middle" font-size="12" fill="#666666">start: one vertex has degree 1</text>
<line x1="290" y1="90" x2="360" y2="70" stroke="#333333" stroke-width="2"/>
<line x1="360" y1="70" x2="400" y2="130" stroke="#333333" stroke-width="2"/>
<line x1="400" y1="130" x2="340" y2="160" stroke="#333333" stroke-width="2"/>
<line x1="340" y1="160" x2="290" y2="90" stroke="#333333" stroke-width="2"/>
<line x1="290" y1="90" x2="400" y2="130" stroke="#333333" stroke-width="2"/>
<line x1="360" y1="70" x2="340" y2="160" stroke="#333333" stroke-width="2"/>
<circle cx="290" cy="90" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="290" y="95" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="360" cy="70" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="360" y="75" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="400" cy="130" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="400" y="135" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="340" cy="160" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="340" y="165" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="340" y="240" text-anchor="middle" font-size="12" fill="#666666">remove it: lost 1 vertex, 1 edge</text>
<line x1="510" y1="90" x2="580" y2="70" stroke="#333333" stroke-width="2"/>
<line x1="580" y1="70" x2="620" y2="130" stroke="#333333" stroke-width="2"/>
<line x1="620" y1="130" x2="560" y2="160" stroke="#333333" stroke-width="2"/>
<line x1="560" y1="160" x2="510" y2="90" stroke="#333333" stroke-width="2"/>
<line x1="510" y1="90" x2="620" y2="130" stroke="#333333" stroke-width="2"/>
<line x1="580" y1="70" x2="560" y2="160" stroke="#333333" stroke-width="2"/>
<circle cx="510" cy="90" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="510" y="95" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="580" cy="70" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="580" y="75" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="620" cy="130" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="620" y="135" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="560" cy="160" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="560" y="165" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="557.8" y="240" font-size="12" fill="#666666" text-anchor="middle">nothing left of low degree: stop</text>
<text x="20" y="272.0" font-size="13" fill="#666666" text-anchor="start">Removing a vertex of degree below k costs at most k-1 edges but a whole vertex, so m/n</text>
<text x="20" y="292.0" font-size="13" fill="#666666" text-anchor="start">cannot fall. Finiteness stops the process.</text>
</svg>