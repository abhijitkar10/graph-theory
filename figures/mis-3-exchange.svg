<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="330" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Why taking a leaf is always safe.</text>
<line x1="160" y1="180" x2="330" y2="180" stroke="#333333" stroke-width="2"/>
<line x1="330" y1="180" x2="510" y2="180" stroke="#333333" stroke-width="2"/>
<circle cx="160" cy="180" r="18" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="160" y="185" text-anchor="middle" font-size="13" fill="#222222">u</text>
<circle cx="330" cy="180" r="18" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="330" y="185" text-anchor="middle" font-size="13" fill="#222222">p</text>
<circle cx="510" cy="180" r="14" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="510" y="185" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="160" y="215" text-anchor="middle" font-size="12" fill="#3B6D11">leaf</text>
<text x="330" y="215" text-anchor="middle" font-size="12" fill="#C0392B">its parent</text>
<text x="510" y="215" text-anchor="middle" font-size="12" fill="#666666">rest of tree</text>
<text x="20" y="258" text-anchor="start" font-size="13" fill="#666666">Take any maximum independent set S. If u is already in it, nothing to do.</text>
<text x="20" y="282" text-anchor="start" font-size="13" fill="#666666">If u is not in S then p must be, since otherwise adding u would give a bigger independent set.</text>
<text x="20" y="306" text-anchor="start" font-size="13" fill="#3B6D11">So swap: drop p, add u. The only vertex adjacent to u was p, and the size is unchanged.</text>
</svg>