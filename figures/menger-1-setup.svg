<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 372" width="660" height="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="372" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">A minimum separator S cuts the graph into the side of x and everything else.</text>
<ellipse cx="112" cy="172" rx="100" ry="108" fill="#e8f2dc" stroke="#3B6D11" stroke-width="2" fill-opacity="0.5" stroke-dasharray="6 4"/>
<ellipse cx="290" cy="172" rx="32" ry="108" fill="#e4eef9" stroke="#185FA5" stroke-width="2.4" fill-opacity="0.6"/>
<ellipse cx="492" cy="172" rx="118" ry="108" fill="#fbe9e7" stroke="#C0392B" stroke-width="2" fill-opacity="0.5" stroke-dasharray="6 4"/>
<line x1="60" y1="170" x2="165" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="170" x2="165" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="170" x2="165" y2="250" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="165" y1="90" x2="290" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="165" y1="170" x2="290" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="165" y1="250" x2="290" y2="250" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="290" y1="90" x2="430" y2="90" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="290" y1="170" x2="430" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="290" y1="250" x2="430" y2="250" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="430" y1="90" x2="560" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="430" y1="170" x2="560" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="430" y1="250" x2="560" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="165" y1="90" x2="165" y2="170" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<line x1="430" y1="170" x2="430" y2="250" stroke="#333333" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="60" cy="170" r="6" fill="#333333"/>
<circle cx="560" cy="170" r="6" fill="#333333"/>
<circle cx="165" cy="90" r="6" fill="#333333"/>
<circle cx="165" cy="170" r="6" fill="#333333"/>
<circle cx="165" cy="250" r="6" fill="#333333"/>
<circle cx="290" cy="90" r="6" fill="#333333"/>
<circle cx="290" cy="170" r="6" fill="#333333"/>
<circle cx="290" cy="250" r="6" fill="#333333"/>
<circle cx="430" cy="90" r="6" fill="#333333"/>
<circle cx="430" cy="170" r="6" fill="#333333"/>
<circle cx="430" cy="250" r="6" fill="#333333"/>
<text x="56" y="156" font-size="15" fill="#333333" text-anchor="middle">x</text>
<text x="564" y="156" font-size="15" fill="#333333" text-anchor="middle">y</text>
<text x="165" y="78" font-size="13" fill="#666666" text-anchor="middle">a₁</text>
<text x="290" y="78" font-size="13" fill="#185FA5" text-anchor="middle">s₁</text>
<text x="430" y="78" font-size="13" fill="#666666" text-anchor="middle">t₁</text>
<text x="165" y="158" font-size="13" fill="#666666" text-anchor="middle">a₂</text>
<text x="290" y="158" font-size="13" fill="#185FA5" text-anchor="middle">s₂</text>
<text x="430" y="158" font-size="13" fill="#666666" text-anchor="middle">t₂</text>
<text x="165" y="238" font-size="13" fill="#666666" text-anchor="middle">a₃</text>
<text x="290" y="238" font-size="13" fill="#185FA5" text-anchor="middle">s₃</text>
<text x="430" y="238" font-size="13" fill="#666666" text-anchor="middle">t₃</text>
<text x="112" y="52" font-size="16" fill="#3B6D11" text-anchor="middle">A</text>
<text x="290" y="52" font-size="16" fill="#185FA5" text-anchor="middle">S</text>
<text x="492" y="52" font-size="16" fill="#C0392B" text-anchor="middle">B</text>
<text x="330" y="310" font-size="12" fill="#666666" text-anchor="middle">Here x and y are not adjacent and the smallest set separating them has k = 3 vertices, so S</text>
<text x="330" y="330" font-size="12" fill="#666666" text-anchor="middle">= {s₁, s₂, s₃} is a minimum separator. A is the component of x in G − S, and B is every</text>
<text x="330" y="350" font-size="12" fill="#666666" text-anchor="middle">other vertex outside S, which includes y.</text>
</svg>
