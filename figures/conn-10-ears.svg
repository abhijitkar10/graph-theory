<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 335" width="660" height="335" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="335" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Four words, one picture. H is the black cycle, and each coloured path is an ear of it</text>
<line x1="178.0" y1="63.0" x2="249.01408311032395" y2="104.0" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="249.01408311032395" y1="104.0" x2="249.01408311032398" y2="186.0" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="249.01408311032398" y1="186.0" x2="178.0" y2="227.0" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="178.0" y1="227.0" x2="106.98591688967605" y2="186.00000000000003" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="106.98591688967605" y1="186.00000000000003" x2="106.98591688967603" y2="104.0" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<line x1="106.98591688967603" y1="104.0" x2="178.0" y2="63.0" stroke="#333333" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="178.0" cy="63.0" r="5" fill="#333333"/>
<circle cx="249.01408311032395" cy="104.0" r="5" fill="#333333"/>
<circle cx="249.01408311032398" cy="186.0" r="5" fill="#333333"/>
<circle cx="178.0" cy="227.0" r="5" fill="#333333"/>
<circle cx="106.98591688967605" cy="186.00000000000003" r="5" fill="#333333"/>
<circle cx="106.98591688967603" cy="104.0" r="5" fill="#333333"/>
<text x="178" y="151" font-size="15" fill="#333333" text-anchor="middle">H</text>
<line x1="178.0" y1="63.0" x2="249.01408311032398" y2="186.0" stroke="#C0392B" stroke-width="2.8" stroke-linecap="round"/>
<text x="268" y="74" font-size="12" fill="#C0392B" text-anchor="start">trivial ear: a single edge, and open</text>
<line x1="249.01408311032398" y1="186.0" x2="392" y2="118" stroke="#3B6D11" stroke-width="2.6" stroke-linecap="round"/>
<line x1="392" y1="118" x2="470" y2="158" stroke="#3B6D11" stroke-width="2.6" stroke-linecap="round"/>
<line x1="470" y1="158" x2="178.0" y2="227.0" stroke="#3B6D11" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="392" cy="118" r="4" fill="#3B6D11"/>
<circle cx="470" cy="158" r="4" fill="#3B6D11"/>
<text x="492" y="150" font-size="12" fill="#3B6D11" text-anchor="start">open ear:</text>
<text x="492" y="168" font-size="12" fill="#666666" text-anchor="start">the two ends differ</text>
<line x1="106.98591688967605" y1="186.00000000000003" x2="140" y2="295" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<line x1="140" y1="295" x2="246" y2="305" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<line x1="246" y1="305" x2="106.98591688967605" y2="186.00000000000003" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="140" cy="295" r="4" fill="#185FA5"/>
<circle cx="246" cy="305" r="4" fill="#185FA5"/>
<text x="282" y="292" font-size="12" fill="#185FA5" text-anchor="start">closed ear: both ends are the same vertex,</text>
<text x="282" y="310" font-size="12" fill="#666666" text-anchor="start">so deleting that one vertex strands all of it</text>
</svg>
