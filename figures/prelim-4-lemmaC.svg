<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="660" height="330" fill="#ffffff"/>
<text x="20" y="24" font-size="13" fill="#666666">Take a maximal path and look at its last vertex. All of its neighbours are stuck on the path.</text>
<line x1="70" y1="150" x2="160" y2="150" stroke="#333333" stroke-width="2"/>
<line x1="160" y1="150" x2="250" y2="150" stroke="#333333" stroke-width="2"/>
<line x1="250" y1="150" x2="340" y2="150" stroke="#333333" stroke-width="2"/>
<line x1="340" y1="150" x2="430" y2="150" stroke="#333333" stroke-width="2"/>
<line x1="430" y1="150" x2="520" y2="150" stroke="#333333" stroke-width="2"/>
<line x1="520" y1="150" x2="600" y2="150" stroke="#333333" stroke-width="2"/>
<path d="M 600 150 Q 425 220 250 150" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<path d="M 600 150 Q 470 202 340 150" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<path d="M 600 150 Q 515 184 430 150" fill="none" stroke="#C0392B" stroke-width="2.5"/>
<circle cx="70" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="70" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="160" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="160" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="250" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="250" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="340" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="340" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="430" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="430" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="520" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="520" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="600" cy="150" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="600" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="600" cy="150" r="11" fill="#FCEBEB" stroke="#C0392B" stroke-width="2"/>
<text x="600" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<circle cx="250" cy="150" r="11" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="250" y="155" text-anchor="middle" font-size="13" fill="#222222"></text>
<text x="600" y="182" text-anchor="middle" font-size="12" fill="#C0392B">vr</text>
<text x="250" y="182" text-anchor="middle" font-size="12" fill="#3B6D11">vi, the furthest</text>
<text x="20" y="244" text-anchor="start" font-size="13" fill="#C0392B">Every neighbour of the last vertex lies on the path. Pick the one furthest back, called vi.</text>
<text x="20" y="268" text-anchor="start" font-size="13" fill="#666666">All k of those neighbours sit inside the stretch from vi to the vertex before vr, so that stretch holds at least k vertices.</text>
<text x="20" y="292" text-anchor="start" font-size="13" fill="#3B6D11">Closing vi back to vr gives a cycle through that whole stretch, so its length is at least k+1.</text>
</svg>