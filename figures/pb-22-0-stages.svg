<text x="330" y="382.0" font-size="13" fill="#333333" text-anchor="middle">G₁ = E₁.    G₂ = E₁ ∪ E₂.    G₃ = E₁ ∪ E₂ ∪ E₃, which here is the whole graph G.</text>
<text x="330" y="412.0" font-size="12" fill="#666666" text-anchor="middle">So Gᵢ₋₁ is whatever you had before adding the i-th ear, and Gᵢ is what you have straight after.</text>
<text x="330" y="433.0" font-size="12" fill="#666666" text-anchor="middle">Read the induction step off the middle panel: Gᵢ₋₁ is the pentagon, Eᵢ is the green path, Gᵢ is both together.</text>
<text x="330" y="454.0" font-size="12" fill="#666666" text-anchor="middle">The ears partition the edges, 5 + 3 + 2 = 10, so no edge is ever added twice.</text>
